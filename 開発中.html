<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>マリオカート ワールド 即時集計＋補正＋ペナルティ＋teamTag＋表形式UI＋自動OCR</title>
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>

  <style>
    table {
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 4px 6px;
    }
    input {
      width: 120px;
    }
    input.name {
      width: 200px;
    }
    .teamTagInput {
      margin-right: 6px;
      margin-bottom: 4px;
    }
    #cam, #imagePreview {
      max-width: 100%;
      height: auto;
      display: block;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- OCRソース選択 -->
  <div>
    <label>OCRソース選択:</label>
    <select id="sourceType">
      <option value="camera">カメラ</option>
      <option value="video">動画ファイル</option>
      <option value="image">画像ファイル</option>
    </select>
    <input type="file" id="fileInput" accept="video/*,image/*" style="display:none;">
  </div>

  <!-- カメラ選択 -->
  <div id="cameraBox">
    <select id="cameraSelect"></select>
    <button id="startCam">カメラ開始</button>
  </div>

  <!-- プレイヤー人数 -->
  <div>
    <label>プレイヤー人数:</label>
    <select id="playerCount">
      <option value="12">12人</option>
      <option value="24">24人</option>
    </select>
  </div>

  <!-- 集計形式 -->
  <div>
    <label>集計形式:</label>
    <select id="format">
      <option value="2v2">2v2</option>
      <option value="3v3">3v3</option>
      <option value="4v4">4v4</option>
      <option value="6v6">6v6</option>
      <option value="8v8">8v8</option>
      <option value="12v12">12v12</option>
    </select>
  </div>

  <!-- teamTag 自動生成欄 -->
  <div>
    <label>チームタグ:</label><br>
    <div id="teamTagContainer"></div>
  </div>

  <!-- OCR実行 -->
  <div>
    <button id="runOcr">OCR実行</button>
  </div>

  <!-- 表形式UI -->
  <table id="playerTable">
    <thead>
      <tr>
        <th>名前</th>
        <th>点数</th>
        <th>補正</th>
        <th>ペナルティ</th>
      </tr>
    </thead>
    <tbody id="playerTableBody"></tbody>
  </table>

  <!-- 再集計 -->
  <div>
    <button id="forceRecalc">再集計</button>
  </div>

  <!-- 結果確認 -->
  <pre id="result"></pre>

  <!-- 映像 / 画像プレビュー -->
  <video id="cam" autoplay playsinline></video>
  <img id="imagePreview" style="display:none;" alt="プレビュー">

<script>
const cameraSelect   = document.getElementById("cameraSelect");
const startCamBtn    = document.getElementById("startCam");
const video          = document.getElementById("cam");
const imagePreview   = document.getElementById("imagePreview");
const playerCountSel = document.getElementById("playerCount");
const runOcrBtn      = document.getElementById("runOcr");
const forceRecalcBtn = document.getElementById("forceRecalc");
const formatSel      = document.getElementById("format");
const teamTagContainer = document.getElementById("teamTagContainer");
const resultPre      = document.getElementById("result");
const sourceType     = document.getElementById("sourceType");
const fileInput      = document.getElementById("fileInput");
const cameraBox      = document.getElementById("cameraBox");

let autoOcrInterval = null;
let isOcrProcessing = false;
let loadedImageElement = null; // 画像モード時の保持用

/* ソース切り替え時の表示・非表示 */
sourceType.onchange = () => {
  stopAutoOcr();
  if (sourceType.value === "camera") {
    fileInput.style.display = "none";
    cameraBox.style.display = "block";
    video.style.display = "block";
    imagePreview.style.display = "none";
  } else if (sourceType.value === "video") {
    cameraBox.style.display = "none";
    fileInput.style.display = "inline-block";
    video.style.display = "block";
    imagePreview.style.display = "none";
  } else {
    // 画像モード
    cameraBox.style.display = "none";
    fileInput.style.display = "inline-block";
    video.style.display = "none";
    imagePreview.style.display = "block";
  }
};

/* ファイル読み込み */
fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  stopAutoOcr();

  if (sourceType.value === "video") {
    const url = URL.createObjectURL(file);
    video.srcObject = null;
    video.src = url;
    video.controls = true;
    try {
      await video.play();
      startAutoOcr();
    } catch (err) {
      console.error("動画の再生に失敗しました:", err);
    }
  } else if (sourceType.value === "image") {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      loadedImageElement = img;
      imagePreview.src = url;
      // 画像の場合は読み込み完了時に1回自動OCRを実行
      runOcrProcess();
    };
    img.src = url;
  }
};

async function requestPermission() {
  try {
    await navigator.mediaDevices.getUserMedia({ video: true });
  } catch (e) {
    alert("カメラの権限が必要です");
  }
}

async function loadCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === "videoinput");

  cameraSelect.innerHTML = "";
  cams.forEach(cam => {
    const opt = document.createElement("option");
    opt.value = cam.deviceId;
    opt.textContent = cam.label || "Camera";
    cameraSelect.appendChild(opt);
  });

  if (cams.length === 0) {
    alert("カメラが見つかりません。");
  }
}

async function startCamera(deviceId) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: { exact: deviceId } }
    });
    video.srcObject = stream;
    video.controls = false;
    await video.play();
    startAutoOcr();
  } catch (err) {
    alert("カメラの起動に失敗しました: " + err);
  }
}

startCamBtn.onclick = () => {
  const id = cameraSelect.value;
  if (id) {
    startCamera(id);
  }
};

(async () => {
  await requestPermission();
  await loadCameras();
})();

function renderTeamTagInputs() {
  const mode = formatSel.value;
  const teamSize = parseInt(mode.split("v")[0]);
  const teamCount = 24 / teamSize;

  teamTagContainer.innerHTML = "";
  for (let i = 0; i < teamCount; i++) {
    const input = document.createElement("input");
    input.className = "teamTagInput";
    input.placeholder = `チーム${i+1}タグ`;
    teamTagContainer.appendChild(input);
  }
}
formatSel.onchange = renderTeamTagInputs;
renderTeamTagInputs();

/* 描画ソース（videoまたはimage）を取得するヘルパー */
getMediaSource = () => {
  if (sourceType.value === "image") {
    return loadedImageElement;
  }
  return video;
};

/* 前処理 */
function preprocessForOCR(media, region) {
  const c = document.createElement("canvas");
  const scale = 3;
  c.width = region.width * scale;
  c.height = region.height * scale;
  const ctx = c.getContext("2d");

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  ctx.drawImage(
    media,
    region.x, region.y, region.width, region.height,
    0, 0, c.width, c.height
  );

  let img = ctx.getImageData(0, 0, c.width, c.height);
  extractWhiteText(img);
  edgeEnhance(img);
  thicken(img);

  ctx.putImageData(img, 0, 0);
  return c;
}

async function ocrRegion(media, region) {
  const canvas = preprocessForOCR(media, region);
  const { data: { text } } = await Tesseract.recognize(canvas, "jpn+eng", { logger: m => {} });
  return normalizeNameChars(text.trim());
}

function normalizeNameChars(name) {
  return name
    .replace(/ /g, " ")
    .replace(/！/g, "!")
    .replace(/？/g, "?")
    .replace(/ー|－|―|—|ｰ|‐/g, "-")
    .trim();
}

function correctNameForTeamTag(name, teamTags) {
  const normalized = normalizeNameChars(name);
  if (teamTags.length === 0) return normalized;

  for (const tag of teamTags) {
    if (normalized.startsWith(tag)) return normalized;
  }

  let bestTag = null;
  let bestScore = Infinity;
  for (const tag of teamTags) {
    const score = levenshtein(normalized.slice(0, tag.length).toLowerCase(), tag.toLowerCase());
    if (score < bestScore) {
      bestScore = score;
      bestTag = tag;
    }
  }

  if (bestScore <= 2 && bestTag) {
    return bestTag + normalized;
  }
  return normalized;
}

function levenshtein(a, b) {
  const dp = Array(a.length + 1).fill(null).map(() => Array(b.length + 1).fill(0));
  for (let i = 0; i <= a.length; i++) dp[i][0] = i;
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;

  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(
        dp[i - 1][j] + 1,
        dp[i][j - 1] + 1,
        dp[i - 1][j - 1] + cost
      );
    }
  }
  return dp[a.length][b.length];
}

function calcNameRegion(i, w, h) {
  const count = parseInt(playerCountSel.value);
  const rowHeight = h / count;
  return {
    x: w * 0.20,
    y: rowHeight * i + (rowHeight * 0.1),
    width: w * 0.30,
    height: rowHeight * 0.8
  };
}

function calcScoreRegion(i, w, h) {
  const count = parseInt(playerCountSel.value);
  const rowHeight = h / count;
  return {
    x: w * 0.65,
    y: rowHeight * i + (rowHeight * 0.1),
    width: w * 0.08,
    height: rowHeight * 0.8
  };
}

async function ocrNames(media, count, w, h) {
  const names = [];
  const teamTags = [...document.querySelectorAll(".teamTagInput")].map(i => i.value.trim()).filter(Boolean);

  for (let i = 0; i < count; i++) {
    const region = calcNameRegion(i, w, h);
    let text = await ocrRegion(media, region);
    text = correctNameForTeamTag(text, teamTags);
    names.push(text);
  }
  return names;
}

async function ocrScores(media, count, w, h) {
  const scores = [];
  for (let i = 0; i < count; i++) {
    const region = calcScoreRegion(i, w, h);
    const score = await ocrScoreRegion(media, region);
    scores.push(score);
  }
  return scores;
}

function renderPlayerInputs(names, scores) {
  const tbody = document.getElementById("playerTableBody");
  tbody.innerHTML = "";
  names.forEach((name, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input class="name" value="${name}"></td>
      <td><input class="score" value="${scores[i]}"></td>
      <td><input class="bonus" value="0"></td>
      <td><input class="penalty" value="0"></td>
    `;
    tbody.appendChild(tr);
  });
}

async function runOcrProcess() {
  if (isOcrProcessing) return;
  
  const media = getMediaSource();
  if (!media) return;

  let w = 0, h = 0;
  if (sourceType.value === "image") {
    w = media.naturalWidth;
    h = media.naturalHeight;
    if (!w || !h) return;
  } else {
    await waitForVideoReady(video);
    w = video.videoWidth;
    h = video.videoHeight;
    if (!w || !h) return;
  }

  isOcrProcessing = true;
  try {
    const count = parseInt(playerCountSel.value);
    const names  = await ocrNames(media, count, w, h);
    const scores = await ocrScores(media, count, w, h);
    renderPlayerInputs(names, scores);
  } catch (e) {
    console.error("OCR Error:", e);
  } finally {
    isOcrProcessing = false;
  }
}

runOcrBtn.onclick = () => {
  runOcrProcess();
};

function startAutoOcr() {
  if (autoOcrInterval) clearInterval(autoOcrInterval);
  autoOcrInterval = setInterval(() => {
    runOcrProcess();
  }, 1500);
}

function stopAutoOcr() {
  if (autoOcrInterval) {
    clearInterval(autoOcrInterval);
    autoOcrInterval = null;
  }
}

forceRecalcBtn.onclick = () => {
  const rows = document.querySelectorAll("#playerTableBody tr");
  const names = [];
  const finalScores = [];

  rows.forEach(row => {
    const name    = row.querySelector(".name").value.trim();
    const score   = parseInt(row.querySelector(".score").value.trim())   || 0;
    const bonus   = parseInt(row.querySelector(".bonus").value.trim())   || 0;
    const penalty = parseInt(row.querySelector(".penalty").value.trim()) || 0;
    names.push(name);
    finalScores.push(score + bonus - penalty);
  });

  const teamTags = [...document.querySelectorAll(".teamTagInput")].map(i => i.value.trim()).filter(Boolean);
  const teams = buildTeams(names, finalScores, teamTags);
  resultPre.textContent = JSON.stringify(teams, null, 2);
};

function buildTeams(names, scores, teamTags) {
  const teams = {};
  teamTags.forEach(tag => {
    teams[tag] = { tag, members: [], total: 0 };
  });
  names.forEach((name, i) => {
    const score = scores[i];
    const tag = teamTags.find(t => name.startsWith(t));
    if (tag) {
      teams[tag].members.push({ name, score });
      teams[tag].total += score;
    }
  });
  return teams;
}

async function waitForVideoReady(video) {
  return new Promise(resolve => {
    if (video.readyState >= 2 && video.videoWidth > 0) {
      resolve();
    } else {
      video.onloadeddata = () => resolve();
    }
  });
}

function extractWhiteText(imgData) {
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const brightness = (r + g + b) / 3;
    if (brightness > 190) {
      data[i] = data[i+1] = data[i+2] = 255;
    } else {
      data[i] = data[i+1] = data[i+2] = 0;
    }
  }
}

function edgeEnhance(img) {
  const data = img.data;
  const w = img.width;
  const h = img.height;

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      const i = (y * w + x) * 4;
      const v = data[i];
      const vL = data[i - 4];
      const vR = data[i + 4];
      const vU = data[i - w * 4];
      const vD = data[i + w * 4];

      const edge = Math.abs(v - vL) + Math.abs(v - vR) + Math.abs(v - vU) + Math.abs(v - vD);
      const out = edge > 40 ? 255 : 0;
      data[i] = data[i+1] = data[i+2] = out;
    }
  }
}

function thicken(imgData) {
  const w = imgData.width;
  const h = imgData.height;
  const src = imgData.data;
  const dst = new Uint8ClampedArray(src.length);

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      let max = 0;
      for (let ky = -1; ky <= 1; ky++) {
        for (let kx = -1; kx <= 1; kx++) {
          const px = ((y + ky) * w + (x + kx)) * 4;
          max = Math.max(max, src[px]);
        }
      }
      const i = (y * w + x) * 4;
      dst[i] = dst[i+1] = dst[i+2] = max;
      dst[i+3] = 255;
    }
  }
  imgData.data.set(dst);
}

async function ocrScoreRegion(media, region) {
  const a = await ocrScoreOnce(media, region);
  const b = await ocrScoreOnce(media, region);

  if (a === b && a !== "") return a;
  if (/^\d+$/.test(a)) return a;
  if (/^\d+$/.test(b)) return b;

  return correctScore(a, b);
}

function preprocessScoreOCR(media, region) {
  const c = document.createElement("canvas");
  const scale = 3;
  c.width = region.width * scale;
  c.height = region.height * scale;
  const ctx = c.getContext("2d");

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';

  ctx.drawImage(
    media,
    region.x, region.y, region.width, region.height,
    0, 0, c.width, c.height
  );

  let img = ctx.getImageData(0, 0, c.width, c.height);
  let data = img.data;

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const v = (r + g + b) / 3;
    if (v < 120) {
      data[i] = data[i+1] = data[i+2] = 255;
    } else {
      data[i] = data[i+1] = data[i+2] = 0;
    }
  }

  ctx.putImageData(img, 0, 0);
  return c;
}

async function ocrScoreOnce(media, region) {
  const canvas = preprocessScoreOCR(media, region);
  const { data: { text } } = await Tesseract.recognize(canvas, "eng", { logger: m => {} });
  return text.trim();
}

function correctScore(a, b) {
  const candidates = [];
  [a, b].forEach(v => {
    if (!v) return;
    v = v.replace(/\D/g, "");
    if (v.length === 0) return;

    let num = parseInt(v);
    if (num >= 0 && num <= 180) {
      candidates.push(num);
      return;
    }

    while (num > 180 && v.length > 1) {
      v = v.slice(0, -1);
      num = parseInt(v);
      if (num >= 0 && num <= 180) {
        candidates.push(num);
        return;
      }
    }
  });

  if (candidates.length > 0) {
    return Math.max(...candidates).toString();
  }
  return "0";
}
</script>
</body>
</html>
