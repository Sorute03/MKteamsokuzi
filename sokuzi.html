<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MK8DX 即時集計＋補正＋ペナルティ＋teamTag＋表形式UI</title>
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>

  <style>
    table {
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 4px 6px;
    }
    input {
      width: 120px;
    }
    input.name {
      width: 200px;
    }
    .teamTagInput {
      margin-right: 6px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<div>
  <label>OCRソース選択:</label>
  <select id="sourceType">
    <option value="camera">カメラ</option>
    <option value="video">動画ファイル</option>
    <option value="image">画像ファイル</option>
  </select>

  <input type="file" id="fileInput" accept="video/*,image/*" style="display:none;">
</div>
  
<!-- カメラ選択（復活） -->
<div id="cameraBox">
  <select id="cameraSelect"></select>
  <button id="startCam">カメラ開始</button>
</div>


  <!-- プレイヤー人数 -->
  <div>
    <label>プレイヤー人数:</label>
    <select id="playerCount">
      <option value="12">12人</option>
      <option value="24">24人</option>
    </select>
  </div>

 <!-- 集計形式 -->
  <div>
    <label>集計形式:</label>
    <select id="format">
      <option value="2v2">2v2</option>
      <option value="3v3">3v3</option>
      <option value="4v4">4v4</option>
      <option value="6v6">6v6</option>
      <option value="8v8">8v8</option>
      <option value="12v12">12v12</option>
    </select>
  </div>
  


  <!-- teamTag 自動生成欄 -->
  <div>
    <label>チームタグ:</label><br>
    <div id="teamTagContainer"></div>
  </div>

  <!-- OCR実行 -->
  <div>
    <button id="runOcr">OCR実行</button>
  </div>

  <!-- 表形式UI -->
  <table id="playerTable">
    <thead>
      <tr>
        <th>名前</th>
        <th>点数</th>
        <th>補正</th>
        <th>ペナルティ</th>
      </tr>
    </thead>
    <tbody id="playerTableBody"></tbody>
  </table>

  <!-- 再集計 -->
  <div>
    <button id="forceRecalc">再集計</button>
  </div>

  <!-- 結果確認 -->
  <pre id="result"></pre>

  <!-- カメラ映像 -->
  <video id="cam" autoplay playsinline></video>

<script>
/* ============================
   カメラ周り
============================ */
const cameraSelect   = document.getElementById("cameraSelect");
const startCamBtn    = document.getElementById("startCam");
const video          = document.getElementById("cam");
const playerCountSel = document.getElementById("playerCount");
const runOcrBtn      = document.getElementById("runOcr");
const forceRecalcBtn = document.getElementById("forceRecalc");
const formatSel      = document.getElementById("format");
const teamTagContainer = document.getElementById("teamTagContainer");
const resultPre      = document.getElementById("result");

const sourceType = document.getElementById("sourceType");
const fileInput  = document.getElementById("fileInput");

// ソース切り替え
sourceType.onchange = () => {
  if (sourceType.value === "camera") {
    fileInput.style.display = "none";
  } else {
    fileInput.style.display = "inline-block";
  }
};

// ファイル読み込み
fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (sourceType.value === "video") {
    const url = URL.createObjectURL(file);
    video.srcObject = null;
    video.src = url;
    video.play();
  }

  if (sourceType.value === "image") {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;

    img.onload = () => {
      // 画像を video に変換（canvas経由）
      const c = document.createElement("canvas");
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0);

      // video に画像を流し込む
      video.srcObject = null;
      video.src = c.toDataURL();
    };
  }
};

sourceType.onchange = () => {
  if (sourceType.value === "camera") {
    fileInput.style.display = "none";
    document.getElementById("cameraBox").style.display = "block";
  } else {
    fileInput.style.display = "inline-block";
    document.getElementById("cameraBox").style.display = "none";
  }
};



/* 権限取得 */
async function requestPermission() {
  try {
    await navigator.mediaDevices.getUserMedia({ video: true });
  } catch (e) {
    alert("カメラの権限が必要です");
  }
}

/* カメラ一覧 */
async function loadCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === "videoinput");

  cameraSelect.innerHTML = "";
  cams.forEach(cam => {
    const opt = document.createElement("option");
    opt.value = cam.deviceId;
    opt.textContent = cam.label || "Camera";
    cameraSelect.appendChild(opt);
  });

  if (cams.length === 0) {
    alert("カメラが見つかりません。OBS 仮想カメラを起動していますか？");
  }
}

/* カメラ開始 */
async function startCamera(deviceId) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { deviceId: { exact: deviceId } }
  });
  video.srcObject = stream;
}

startCamBtn.onclick = () => {
  const id = cameraSelect.value;
  if (id) startCamera(id);
};

/* 初期化 */
(async () => {
  await requestPermission();
  await loadCameras();
})();

/* ============================
   teamTag 自動生成
============================ */
function renderTeamTagInputs() {
  const mode = formatSel.value;   // "2v2" など
  const teamSize = parseInt(mode.split("v")[0]); // 左側の数字（2,3,4,6,8,12）

  const teamCount = 24 / teamSize; // MK8DXは24人固定

  teamTagContainer.innerHTML = "";

  for (let i = 0; i < teamCount; i++) {
    const input = document.createElement("input");
    input.className = "teamTagInput";
    input.placeholder = `チーム${i+1}タグ`;
    teamTagContainer.appendChild(input);
  }
}


formatSel.onchange = renderTeamTagInputs;
renderTeamTagInputs();

/* ============================
   OCR前処理（MK8DX専用）
============================ */
function preprocessForOCR(video, region) {
  const c = document.createElement("canvas");
  c.width = region.width * 3;
  c.height = region.height * 3;
  const ctx = c.getContext("2d");

  ctx.drawImage(
    video,
    region.x, region.y, region.width, region.height,
    0, 0, c.width, c.height
  );

  let img = ctx.getImageData(0, 0, c.width, c.height);
  let data = img.data;

  for (let i = 0; i < data.length; i += 4) {
    let r = data[i], g = data[i+1], b = data[i+2];
    let v = 0.299*r + 0.587*g + 0.114*b;

    v = v < 128 ? v * 0.5 : v * 1.8;
    v = Math.pow(v / 255, 0.45) * 255;
    v = v > 150 ? 255 : 0;

    data[i] = data[i+1] = data[i+2] = v;
  }

  ctx.putImageData(img, 0, 0);
  return c;
}

/* ============================
   OCR実行
============================ */
async function ocrRegion(video, region) {
  const canvas = preprocessForOCR(video, region);

  const whitelist =
    "0123456789" +
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz" +
    "ぁあぃいぅうぇえぉおかがきぎくぐけげこご" +
    "さざしじすずせぜそぞただちぢつづてでとど" +
    "なにぬねのはばぱひびぴふぶぷへべぺほぼぽ" +
    "まみむめもやゆよらりるれろわをん" +
    "ァアィイゥウェエォオカガキギクグケゲコゴ" +
    "サザシジスズセゼソゾタダチヂツヅテデトド" +
    "ナニヌネノハバパヒビピフブプヘベペホボポ" +
    "マミムメモヤユヨラリルレロワヲン" +
    "★☆+-_[](){}<>!?/\\|";

  const { data: { text } } = await Tesseract.recognize(
    canvas,
    "jpn",
    {
      tessedit_char_whitelist: whitelist,
      psm: 7,
      oem: 1
    }
  );

  return text.trim();
}

/* ============================
   OCR領域計算
============================ */
function calcNameRegion(i, vw, vh) {
  const count = parseInt(playerCountSel.value);
  const rowHeight = vh / count;

  return {
    x: vw * 0.18,
    y: rowHeight * i,
    width: vw * 0.32,
    height: rowHeight
  };
}

function calcScoreRegion(i, vw, vh) {
  const count = parseInt(playerCountSel.value);
  const rowHeight = vh / count;

  return {
    x: vw * 0.63,
    y: rowHeight * i,
    width: vw * 0.10,
    height: rowHeight
  };
}

/* ============================
   名前・点数 OCR
============================ */
async function ocrNames(video, count) {
  const names = [];
  const vw = video.videoWidth;
  const vh = video.videoHeight;

  for (let i = 0; i < count; i++) {
    const region = calcNameRegion(i, vw, vh);
    const text = await ocrRegion(video, region);
    names.push(text);
  }
  return names;
}

async function ocrScores(video, count) {
  const scores = [];
  const vw = video.videoWidth;
  const vh = video.videoHeight;

  for (let i = 0; i < count; i++) {
    const region = calcScoreRegion(i, vw, vh);
    const text = await ocrRegion(video, region);
    scores.push(text);
  }
  return scores;
}

/* ============================
   表形式UI生成
============================ */
function renderPlayerInputs(names, scores) {
  const tbody = document.getElementById("playerTableBody");
  tbody.innerHTML = "";

  names.forEach((name, i) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td><input class="name" value="${name}"></td>
      <td><input class="score" value="${scores[i]}"></td>
      <td><input class="bonus" value="0"></td>
      <td><input class="penalty" value="0"></td>
    `;

    tbody.appendChild(tr);
  });
}

/* OCR実行ボタン */
runOcrBtn.onclick = async () => {
  // ★ ここが重要：video の準備ができるまで待つ
  await waitForVideoReady(video);

  const count = parseInt(playerCountSel.value);

  const names  = await ocrNames(video, count);
  const scores = await ocrScores(video, count);

  renderPlayerInputs(names, scores);
};


async function waitForVideoReady(video) {
  return new Promise(resolve => {
    if (video.readyState >= 2 && video.videoWidth > 0) {
      resolve();
    } else {
      video.onloadeddata = () => resolve();
    }
  });
}


/* ============================
   再集計
============================ */
forceRecalcBtn.onclick = () => {
  const rows = document.querySelectorAll("#playerTableBody tr");

  const names = [];
  const finalScores = [];

  rows.forEach(row => {
    const name    = row.querySelector(".name").value.trim();
    const score   = parseInt(row.querySelector(".score").value.trim())   || 0;
    const bonus   = parseInt(row.querySelector(".bonus").value.trim())   || 0;
    const penalty = parseInt(row.querySelector(".penalty").value.trim()) || 0;

    names.push(name);
    finalScores.push(score + bonus - penalty);
  });

  const teamTags = [...document.querySelectorAll(".teamTagInput")]
    .map(i => i.value.trim())
    .filter(Boolean);

  const teams = buildTeams(names, finalScores, teamTags);

  resultPre.textContent = JSON.stringify(teams, null, 2);
};

/* ============================
   チーム分け
============================ */
function buildTeams(names, scores, teamTags) {
  const teams = {};

  teamTags.forEach(tag => {
    teams[tag] = { tag, members: [], total: 0 };
  });

  names.forEach((name, i) => {
    const score = scores[i];
    const tag = teamTags.find(t => name.startsWith(t));

    if (tag) {
      teams[tag].members.push({ name, score });
      teams[tag].total += score;
    }
  });

  return teams;
}

</script>
</body>
</html>
