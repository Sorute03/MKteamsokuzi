<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MK8DX 即時集計＋補正＋ペナルティ</title>
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
  <style>
    .player-row {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
    }
    .player-row input {
      width: 120px;
    }
    .player-row input.name {
      width: 200px;
    }
  </style>
</head>
<body>

  <!-- カメラ選択 -->
  <div>
    <select id="cameraSelect"></select>
    <button id="startCam">カメラ開始</button>
  </div>

  <!-- プレイヤー人数（12 or 24） -->
  <div>
    <label>プレイヤー人数:</label>
    <select id="playerCount">
      <option value="12">12人</option>
      <option value="24">24人</option>
    </select>
  </div>

  <!-- 集計形式（2v2〜12v12） -->
  <div>
    <label>集計形式:</label>
    <select id="format">
      <option value="2v2">2v2</option>
      <option value="3v3">3v3</option>
      <option value="4v4">4v4</option>
      <option value="6v6">6v6</option>
      <option value="8v8">8v8</option>
      <option value="12v12">12v12</option>
    </select>
  </div>

  <!-- チームタグ -->
  <div>
    <label>チームタグ（カンマ区切り）:</label><br>
    <textarea id="teamTags" rows="2" cols="40">ZX★,Mf,αTau,Ans☆</textarea>
  </div>

  <!-- OCR実行 -->
  <div>
    <button id="runOcr">OCR実行</button>
  </div>

  <!-- プレイヤー編集UI（名前＋点数＋補正＋ペナルティ） -->
  <div id="playerInputs"></div>

  <!-- 再集計 -->
  <div>
    <button id="forceRecalc">再集計</button>
  </div>

  <!-- 結果確認 -->
  <pre id="result"></pre>

  <!-- カメラ映像 -->
  <video id="cam" autoplay playsinline></video>

  <script>
    // ===== カメラ周り =====
    const cameraSelect   = document.getElementById("cameraSelect");
    const startCamBtn    = document.getElementById("startCam");
    const video          = document.getElementById("cam");
    const playerCountSel = document.getElementById("playerCount");
    const runOcrBtn      = document.getElementById("runOcr");
    const playerInputs   = document.getElementById("playerInputs");
    const forceRecalcBtn = document.getElementById("forceRecalc");
    const teamTagsInput  = document.getElementById("teamTags");
    const formatSel      = document.getElementById("format");
    const resultPre      = document.getElementById("result");

    async function loadCameras() {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const cams = devices.filter(d => d.kind === "videoinput");

      cameraSelect.innerHTML = "";
      cams.forEach(cam => {
        const opt = document.createElement("option");
        opt.value = cam.deviceId;
        opt.textContent = cam.label || `Camera ${cameraSelect.length + 1}`;
        cameraSelect.appendChild(opt);
      });
    }

    async function startCamera(deviceId) {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { deviceId: { exact: deviceId } }
      });
      video.srcObject = stream;
    }

    startCamBtn.onclick = () => {
      const id = cameraSelect.value;
      if (id) startCamera(id);
    };

    loadCameras();

    // ===== OCR共通関数 =====
    async function ocrRegion(video, region) {
      const c = document.createElement("canvas");
      c.width = region.width;
      c.height = region.height;
      const ctx = c.getContext("2d");

      ctx.drawImage(
        video,
        region.x, region.y, region.width, region.height,
        0, 0, region.width, region.height
      );

      const { data: { text } } = await Tesseract.recognize(c, "jpn");
      return text;
    }

    // ===== 名前・点数の領域計算（12人 / 24人対応） =====
    function calcNameRegion(i, videoWidth, videoHeight) {
      const count = parseInt(playerCountSel.value);
      const rowHeight = videoHeight / count;

      return {
        x: videoWidth * 0.18,
        y: rowHeight * i,
        width: videoWidth * 0.32,
        height: rowHeight
      };
    }

    function calcScoreRegion(i, videoWidth, videoHeight) {
      const count = parseInt(playerCountSel.value);
      const rowHeight = videoHeight / count;

      return {
        x: videoWidth * 0.63,
        y: rowHeight * i,
        width: videoWidth * 0.10,
        height: rowHeight
      };
    }

    // ===== 名前・
