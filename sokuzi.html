<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MK8DX 即時集計＋補正＋ペナルティ＋teamTag＋表形式UI＋自動OCR</title>
  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>

  <style>
    table {
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #aaa;
      padding: 4px 6px;
    }
    input {
      width: 120px;
    }
    input.name {
      width: 200px;
    }
    .teamTagInput {
      margin-right: 6px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <!-- OCRソース選択 -->
  <div>
    <label>OCRソース選択:</label>
    <select id="sourceType">
      <option value="camera">カメラ</option>
      <option value="video">動画ファイル</option>
      <option value="image">画像ファイル</option>
    </select>
    <input type="file" id="fileInput" accept="video/*,image/*" style="display:none;">
  </div>

  <!-- カメラ選択 -->
  <div id="cameraBox">
    <select id="cameraSelect"></select>
    <button id="startCam">カメラ開始</button>
  </div>

  <!-- プレイヤー人数 -->
  <div>
    <label>プレイヤー人数:</label>
    <select id="playerCount">
      <option value="12">12人</option>
      <option value="24">24人</option>
    </select>
  </div>

  <!-- 集計形式 -->
  <div>
    <label>集計形式:</label>
    <select id="format">
      <option value="2v2">2v2</option>
      <option value="3v3">3v3</option>
      <option value="4v4">4v4</option>
      <option value="6v6">6v6</option>
      <option value="8v8">8v8</option>
      <option value="12v12">12v12</option>
    </select>
  </div>

  <!-- teamTag 自動生成欄 -->
  <div>
    <label>チームタグ:</label><br>
    <div id="teamTagContainer"></div>
  </div>

  <!-- OCR実行 -->
  <div>
    <button id="runOcr">OCR実行</button>
  </div>

  <!-- 表形式UI -->
  <table id="playerTable">
    <thead>
      <tr>
        <th>名前</th>
        <th>点数</th>
        <th>補正</th>
        <th>ペナルティ</th>
      </tr>
    </thead>
    <tbody id="playerTableBody"></tbody>
  </table>

  <!-- 再集計 -->
  <div>
    <button id="forceRecalc">再集計</button>
  </div>

  <!-- 結果確認 -->
  <pre id="result"></pre>

  <!-- 映像 -->
  <video id="cam" autoplay playsinline></video>

<script>
const cameraSelect   = document.getElementById("cameraSelect");
const startCamBtn    = document.getElementById("startCam");
const video          = document.getElementById("cam");
const playerCountSel = document.getElementById("playerCount");
const runOcrBtn      = document.getElementById("runOcr");
const forceRecalcBtn = document.getElementById("forceRecalc");
const formatSel      = document.getElementById("format");
const teamTagContainer = document.getElementById("teamTagContainer");
const resultPre      = document.getElementById("result");
const sourceType     = document.getElementById("sourceType");
const fileInput      = document.getElementById("fileInput");
const cameraBox      = document.getElementById("cameraBox");

let autoOcrRunning = false;

/* ソース切り替え */
sourceType.onchange = () => {
  if (sourceType.value === "camera") {
    fileInput.style.display = "none";
    cameraBox.style.display = "block";
    autoOcrRunning = true;
    autoOcrLoop();
  } else {
    cameraBox.style.display = "none";
    fileInput.style.display = "inline-block";
    autoOcrRunning = (sourceType.value === "video");
    if (autoOcrRunning) autoOcrLoop();
  }
};

/* ファイル読み込み */
fileInput.onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  if (sourceType.value === "video") {
    const url = URL.createObjectURL(file);
    video.srcObject = null;
    video.src = url;
    video.controls = true;   // ★ シークバー表示
    video.play();
  }

  if (sourceType.value === "image") {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;

    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.width;
      c.height = img.height;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0);

      video.srcObject = null;
      video.src = c.toDataURL();
      video.controls = false; // ★ 画像はコントロール不要
    };
  }
};


/* 権限取得 */
async function requestPermission() {
  try {
    await navigator.mediaDevices.getUserMedia({ video: true });
  } catch (e) {
    alert("カメラの権限が必要です");
  }
}

/* カメラ一覧 */
async function loadCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === "videoinput");

  cameraSelect.innerHTML = "";
  cams.forEach(cam => {
    const opt = document.createElement("option");
    opt.value = cam.deviceId;
    opt.textContent = cam.label || "Camera";
    cameraSelect.appendChild(opt);
  });

  if (cams.length === 0) {
    alert("カメラが見つかりません。OBS 仮想カメラを起動していますか？");
  }
}

/* カメラ開始 */
async function startCamera(deviceId) {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { deviceId: { exact: deviceId } }
  });
  video.srcObject = stream;
}

startCamBtn.onclick = () => {
  const id = cameraSelect.value;
  if (id) {
    startCamera(id);
    video.controls = false; // ★ カメラはシークバー不要
  }
};

/* 初期化 */
(async () => {
  await requestPermission();
  await loadCameras();
})();

/* teamTag 自動生成 */
function renderTeamTagInputs() {
  const mode = formatSel.value;
  const teamSize = parseInt(mode.split("v")[0]);
  const teamCount = 24 / teamSize;

  teamTagContainer.innerHTML = "";
  for (let i = 0; i < teamCount; i++) {
    const input = document.createElement("input");
    input.className = "teamTagInput";
    input.placeholder = `チーム${i+1}タグ`;
    teamTagContainer.appendChild(input);
  }
}
formatSel.onchange = renderTeamTagInputs;
renderTeamTagInputs();

/* OCR前処理 */
function preprocessForOCR(video, region) {
  const c = document.createElement("canvas");
  c.width = region.width * 3;
  c.height = region.height * 3;
  const ctx = c.getContext("2d");

  ctx.drawImage(
    video,
    region.x, region.y, region.width, region.height,
    0, 0, c.width, c.height
  );

  let img = ctx.getImageData(0, 0, c.width, c.height);

  // 白文字抽出
  extractWhiteText(img);

  // 輪郭強調
  edgeEnhance(img);

  // 文字を太くする
  thicken(img);

  ctx.putImageData(img, 0, 0);
  return c;
}


/* OCR */
async function ocrRegion(video, region) {
  const canvas = preprocessForOCR(video, region);

  const whitelist =
    "0123456789" +
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz" +
    "ぁあぃいぅうぇえぉおかがきぎくぐけげこご" +
    "さざしじすずせぜそぞただちぢつづてでとど" +
    "なにぬねのはばぱひびぴふぶぷへべぺほぼぽ" +
    "まみむめもやゆよらりるれろわをん" +
    "ァアィイゥウェエォオカガキギクグケゲコゴ" +
    "サザシジスズセゼソゾタダチヂツヅテデトド" +
    "ナニヌネノハバパヒビピフブプヘベペホボポ" +
    "マミムメモヤユヨラリルレロワヲン" +
    "★☆+-_[](){}<>!?/\\|"^;

  const { data: { text } } = await Tesseract.recognize(
    canvas,
    "jpn",
    {
      tessedit_char_whitelist: whitelist,
      psm: 7,
      oem: 1
    }
  );

  return text.trim();
}

/* OCR領域計算 */
function calcNameRegion(i, vw, vh) {
  const count = parseInt(playerCountSel.value);
  const rowHeight = vh / count;
  return {
    x: vw * 0.18,
    y: rowHeight * i,
    width: vw * 0.32,
    height: rowHeight
  };
}

function calcScoreRegion(i, vw, vh) {
  const count = parseInt(playerCountSel.value);
  const rowHeight = vh / count;
  return {
    x: vw * 0.63,
    y: rowHeight * i,
    width: vw * 0.10,
    height: rowHeight
  };
}

/* 名前・点数 OCR */
async function ocrNames(video, count) {
  const names = [];
  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const teamTags = [...document.querySelectorAll(".teamTagInput")]
    .map(i => i.value.trim())
    .filter(Boolean);

  for (let i = 0; i < count; i++) {
    const region = calcNameRegion(i, vw, vh);
    let text = await ocrRegion(video, region);

    // ★ teamTag専用補正
    text = correctNameForTeamTag(text, teamTags);

    names.push(text);
  }
  return names;
}


async function ocrScores(video, count) {
  const scores = [];
  const vw = video.videoWidth;
  const vh = video.videoHeight;

  for (let i = 0; i < count; i++) {
    const region = calcScoreRegion(i, vw, vh);
    const score = await ocrScoreRegion(video, region);
    scores.push(score);
  }
  return scores;
}


/* 表UI生成 */
function renderPlayerInputs(names, scores) {
  const tbody = document.getElementById("playerTableBody");
  tbody.innerHTML = "";
  names.forEach((name, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input class="name" value="${name}"></td>
      <td><input class="score" value="${scores[i]}"></td>
      <td><input class="bonus" value="0"></td>
      <td><input class="penalty" value="0"></td>
    `;
    tbody.appendChild(tr);
  });
}

/* video準備待ち */
async function waitForVideoReady(video) {
  return new Promise(resolve => {
    if (video.readyState >= 2 && video.videoWidth > 0) {
      resolve();
    } else {
      video.onloadeddata = () => resolve();
    }
  });
}

/* 手動OCR */
runOcrBtn.onclick = async () => {
  await waitForVideoReady(video);
  const count = parseInt(playerCountSel.value);
  const names  = await ocrNames(video, count);
  const scores = await ocrScores(video, count);
  renderPlayerInputs(names, scores);
};

/* 再集計 */
forceRecalcBtn.onclick = () => {
  const rows = document.querySelectorAll("#playerTableBody tr");
  const names = [];
  const finalScores = [];

  rows.forEach(row => {
    const name    = row.querySelector(".name").value.trim();
    const score   = parseInt(row.querySelector(".score").value.trim())   || 0;
    const bonus   = parseInt(row.querySelector(".bonus").value.trim())   || 0;
    const penalty = parseInt(row.querySelector(".penalty").value.trim()) || 0;
    names.push(name);
    finalScores.push(score + bonus - penalty);
  });

  const teamTags = [...document.querySelectorAll(".teamTagInput")]
    .map(i => i.value.trim())
    .filter(Boolean);

  const teams = buildTeams(names, finalScores, teamTags);
  resultPre.textContent = JSON.stringify(teams, null, 2);
};

/* チーム分け */
function buildTeams(names, scores, teamTags) {
  const teams = {};
  teamTags.forEach(tag => {
    teams[tag] = { tag, members: [], total: 0 };
  });
  names.forEach((name, i) => {
    const score = scores[i];
    const tag = teamTags.find(t => name.startsWith(t));
    if (tag) {
      teams[tag].members.push({ name, score });
      teams[tag].total += score;
    }
  });
  return teams;
}

/* 最終リザルト判定 */
function detectFinalResultText(video) {
  const c = document.createElement("canvas");
  c.width = 300;
  c.height = 120;
  const ctx = c.getContext("2d");

  ctx.drawImage(
    video,
    video.videoWidth * 0.25, video.videoHeight * 0.05,
    video.videoWidth * 0.5, video.videoHeight * 0.15,
    0, 0, c.width, c.height
  );

  const img = ctx.getImageData(0, 0, c.width, c.height);
  const data = img.data;

  let whiteCount = 0;
  for (let i = 0; i < data.length; i += 4) {
    const v = (data[i] + data[i+1] + data[i+2]) / 3;
    if (v > 220) whiteCount++;
  }
  return whiteCount > 2000;
}

function isTeamBattle() {
  const mode = formatSel.value;
  return ["6v6", "8v8", "12v12"].includes(mode);
}

function detectTeamColorPanels(video) {
  const c = document.createElement("canvas");
  c.width = 200;
  c.height = 200;
  const ctx = c.getContext("2d");

  ctx.drawImage(
    video,
    video.videoWidth * 0.60, video.videoHeight * 0.20,
    video.videoWidth * 0.35, video.videoHeight * 0.60,
    0, 0, c.width, c.height
  );

  const img = ctx.getImageData(0, 0, c.width, c.height);
  const data = img.data;

  let red = 0, blue = 0, yellow = 0, green = 0;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    if (r > 180 && g < 80 && b < 80) red++;
    if (b > 180 && r < 80 && g < 80) blue++;
    if (r > 180 && g > 180 && b < 80) yellow++;
    if (g > 180 && r < 80 && b < 80) green++;
  }
  return (red > 200) || (blue > 200) || (yellow > 200) || (green > 200);
}

function isFinalResultScreen(video) {
  const finalText = detectFinalResultText(video);
  if (!finalText) return false;
  if (isTeamBattle()) {
    return detectTeamColorPanels(video);
  } else {
    return true;
  }
}

/* 自動OCRループ */
async function autoOcrLoop() {
  if (!autoOcrRunning) return;
  await waitForVideoReady(video);
  if (isFinalResultScreen(video)) {
    const count = parseInt(playerCountSel.value);
    const names  = await ocrNames(video, count);
    const scores = await ocrScores(video, count);
    renderPlayerInputs(names, scores);
  }
  requestAnimationFrame(autoOcrLoop);
}


// 白文字抽出（MK8DX専用）
function extractWhiteText(imgData) {
  const data = imgData.data;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const brightness = (r + g + b) / 3;

    // 白文字だけ残す
    if (brightness > 200) {
      data[i] = data[i+1] = data[i+2] = 255;
    } else {
      data[i] = data[i+1] = data[i+2] = 0;
    }
  }
}

function edgeEnhance(imgData) {
  const w = imgData.width;
  const h = imgData.height;
  const src = imgData.data;
  const dst = new Uint8ClampedArray(src.length);

  const kernel = [
    -1, -1, -1,
    -1,  8, -1,
    -1, -1, -1
  ];

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      let sum = 0;
      for (let ky = -1; ky <= 1; ky++) {
        for (let kx = -1; kx <= 1; kx++) {
          const px = ((y + ky) * w + (x + kx)) * 4;
          const v = (src[px] + src[px+1] + src[px+2]) / 3;
          sum += v * kernel[(ky+1)*3 + (kx+1)];
        }
      }
      const i = (y * w + x) * 4;
      const v = Math.min(255, Math.max(0, sum));
      dst[i] = dst[i+1] = dst[i+2] = v;
      dst[i+3] = 255;
    }
  }

  imgData.data.set(dst);
}


function thicken(imgData) {
  const w = imgData.width;
  const h = imgData.height;
  const src = imgData.data;
  const dst = new Uint8ClampedArray(src.length);

  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      let max = 0;
      for (let ky = -1; ky <= 1; ky++) {
        for (let kx = -1; kx <= 1; kx++) {
          const px = ((y + ky) * w + (x + kx)) * 4;
          max = Math.max(max, src[px]);
        }
      }
      const i = (y * w + x) * 4;
      dst[i] = dst[i+1] = dst[i+2] = max;
      dst[i+3] = 255;
    }
  }

  imgData.data.set(dst);
}


async function ocrScoreRegion(video, region) {
  const a = await ocrScoreOnce(video, region);
  const b = await ocrScoreOnce(video, region);

  if (a === b && a !== "") return a;

  // どちらかが数字ならそれを採用
  if (/^\d+$/.test(a)) return a;
  if (/^\d+$/.test(b)) return b;

  // どちらも数字でない → 補正へ
  return correctScore(a, b);
}


function correctNameForTeamTag(name, teamTags) {
  const normalized = name.replace(/ /g, "").trim();

  // teamTag が先頭に含まれているかチェック
  for (const tag of teamTags) {
    if (normalized.startsWith(tag)) {
      return normalized; // そのままでOK
    }
  }

  // OCRがタグを欠損した場合 → 最も近いタグを補完
  let bestTag = null;
  let bestScore = Infinity;

  for (const tag of teamTags) {
    const score = levenshtein(normalized.slice(0, tag.length).toLowerCase(), tag.toLowerCase());
    if (score < bestScore) {
      bestScore = score;
      bestTag = tag;
    }
  }

  // タグが近ければ補完する
  if (bestScore <= 1) {
    return bestTag + normalized;
  }

  return normalized;
}

function preprocessScoreOCR(video, region) {
  const c = document.createElement("canvas");
  c.width = region.width * 3;
  c.height = region.height * 3;
  const ctx = c.getContext("2d");

  ctx.drawImage(
    video,
    region.x, region.y, region.width, region.height,
    0, 0, c.width, c.height
  );

  let img = ctx.getImageData(0, 0, c.width, c.height);
  let data = img.data;

  // 白文字抽出（数字はほぼ白）
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    const v = (r + g + b) / 3;
    data[i] = data[i+1] = data[i+2] = (v > 200 ? 255 : 0);
  }

  // 輪郭強調
  edgeEnhance(img);

  // 文字を太くする
  thicken(img);

  ctx.putImageData(img, 0, 0);
  return c;
}

async function ocrScoreOnce(video, region) {
  const canvas = preprocessScoreOCR(video, region);

  const { data: { text } } = await Tesseract.recognize(
    canvas,
    "jpn",
    {
      tessedit_char_whitelist: "0123456789",
      psm: 7,
      oem: 1
    }
  );

  return text.trim();
}


function correctScore(a, b) {
  const candidates = [];

  [a, b].forEach(v => {
    if (!v) return;

    // 数字以外除去
    v = v.replace(/\D/g, "");

    if (v.length === 0) return;

    let num = parseInt(v);

    // ★ 180までの数字だけ採用
    if (num >= 0 && num <= 180) {
      candidates.push(num);
      return;
    }

    // ★ 180を超える場合 → 末尾の0を削る（例：1800 → 180）
    while (num > 180 && v.length > 1) {
      v = v.slice(0, -1); // 末尾を削る
      num = parseInt(v);
      if (num <= 180) {
        candidates.push(num);
        return;
      }
    }
  });

  // 候補があれば最大値を返す
  if (candidates.length > 0) {
    return Math.max(...candidates).toString();
  }

  // それでも取れない → 0扱い
  return "0";
}



</script>
</body>
</html>
