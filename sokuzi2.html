<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MK Rank Input</title>

<style>
body { margin:0; padding:10px; font-family:sans-serif; }
#tabs { display:flex; gap:4px; margin-bottom:10px; }
.tabBtn { padding:6px 12px; border:1px solid #ccc; background:#f5f5f5; cursor:pointer; }
.tabBtn.active { background:#4caf50; color:#fff; }
.tabContent { margin-top:10px; }
.team-section { margin-bottom:20px; }
.rank-buttons { display:flex; flex-wrap:wrap; gap:4px; }
.rank-button {
  width:32px; height:32px; text-align:center; line-height:32px;
  border:1px solid #ccc; cursor:pointer; border-radius:4px; font-size:12px;
}
.rank-button.selected { background:#4caf50; color:white; }
#penaltyModal {
  display:none; position:fixed; top:50%; left:50%;
  transform:translate(-50%,-50%); background:white;
  padding:20px; border:2px solid #333; border-radius:10px; z-index:9999;
}
.record { border:1px solid #ccc; padding:6px; margin:4px 0; font-size:12px; }
#jsonDropArea {
  width:100%; height:120px; border:2px dashed #888; border-radius:10px;
  display:flex; align-items:center; justify-content:center; background:#fafafa;
}
</style>
</head>
<body>

<!-- タブ -->
<div id="tabs">
  <button class="tabBtn active" data-tab="inputTab">入力</button>
  <button class="tabBtn" data-tab="historyTab">戦績</button>
  <button class="tabBtn" data-tab="jsonTab">JSON</button>
  <button class="tabBtn" data-tab="p2pTab">P2P</button>
  <button class="tabBtn" data-tab="resultTab">リザルト</button>
  <button class="tabBtn" data-tab="webhookTab">Webhook</button>
</div>

<!-- 入力タブ -->
<div id="inputTab" class="tabContent" style="display:block;">

  <h3>モード設定</h3>
  <div>
    <label>モード：</label>
    <select id="modeSelect" onchange="setFormatFromMode(this.value)">
      <option value="3v3">3v3</option>
      <option value="4v4">4v4</option>
      <option value="6v6" selected>6v6</option>
      <option value="8v8">8v8</option>
      <option value="12v12">12v12</option>
    </select>
  </div>

  <h3>チーム設定</h3>
  <div>
    <label>チーム数：</label>
    <select id="teamCountSelect" onchange="createEnemyTeamEditor()">
      <option value="2">2チーム</option>
      <option value="3">3チーム</option>
      <option value="4" selected>4チーム</option>
      <option value="5">5チーム</option>
      <option value="6">6チーム</option>
    </select>
  </div>
  <br>
  <div>
    <label>自チーム：</label>
    <input id="myTeamInput" value="チーム1">
  </div>
  <br>
  <div id="enemyTeamEditor"></div>
  <button onclick="applyTeamNames()">チーム名を適用</button>

  <hr>

  <h3>コース選択</h3>
  <div id="course-container"></div>

  <div class="button-bar" style="margin-top:10px;">
    <button onclick="resetRanks()">リセット</button>
    <button onclick="openPenaltyTeamSelect()">ペナルティ</button>
    <button onclick="saveHistoryRecord()">この試合をローカル保存</button>
    <button onclick="sendHistoryToGAS()">この試合を共有保存</button>
  </div>

  <div id="teams-container" style="margin-top:10px;"></div>

  <h3>スコア</h3>
  <table id="scoreTable" border="1">
    <thead><tr><th>順位</th><th>チーム</th><th>スコア</th></tr></thead>
    <tbody></tbody>
  </table>

  <h3>タイムスタンプ</h3>
  <input id="timestampInput" placeholder="例: 2026/6/3 21（空欄なら自動）" style="width:200px;">

  <!-- ペナルティ用モーダル -->
  <div id="penaltyModal">
    <h3>ペナルティ対象チームを選択</h3>
    <div id="penaltyTeamButtons"></div>
    <button onclick="closePenaltyModal()">閉じる</button>
  </div>

</div>

<!-- 戦績タブ -->
<div id="historyTab" class="tabContent" style="display:none;">
  <h3>個人戦績（IndexedDB）</h3>
  <div id="localHistory"></div>
</div>

<!-- JSON タブ -->
<div id="jsonTab" class="tabContent" style="display:none;">

  <h3>JSON 操作</h3>
  <button onclick="exportJSON()">JSON を表示</button>
  <button onclick="downloadJSONFile()">JSON を保存</button>
  <input type="file" id="jsonFileInput" accept="application/json" onchange="uploadJSONFile(this.files[0])">

  <h3>JSON 共有モード</h3>
  <select id="jsonShareModeSelect" onchange="updateJsonShareMode()">
    <option value="all">全データ共有</option>
    <option value="team">特定チームのみ</option>
  </select>

  <div id="jsonShareTeamArea" style="display:none; margin-top:6px;">
    <label>チーム選択：</label>
    <select id="jsonShareTeamSelect"></select>
  </div>

  <h4>特定チーム JSON（旧 UI）</h4>
  <input id="teamJsonInput" placeholder="チーム名">
  <button onclick="downloadTeamJSONFile(document.getElementById('teamJsonInput').value)">保存</button>

  <h4>JSON 読み込み（ドラッグ＆ドロップ）</h4>
  <div id="jsonDropArea">ここに JSON ファイルをドロップ</div>

  <textarea id="jsonArea" style="width:100%;height:200px;margin-top:10px;"></textarea>

</div>


<!-- P2P タブ -->
<div id="p2pTab" class="tabContent" style="display:none;">

  <h3>P2P 共有</h3>
  <button onclick="startP2PHost()">ホスト開始</button>
  <button onclick="startP2PClient()">クライアント接続</button>

  <h3>P2P 共有モード</h3>
  <select id="p2pShareModeSelect" onchange="updateP2pShareMode()">
    <option value="all">全データ共有</option>
    <option value="team">特定チームのみ</option>
  </select>

  <div id="p2pShareTeamArea" style="display:none; margin-top:6px;">
    <label>チーム選択：</label>
    <select id="p2pShareTeamSelect"></select>
  </div>

  <div id="p2pStatus" style="margin-top:10px;"></div>

</div>


<!-- Webhook タブ -->
<div id="webhookTab" class="tabContent" style="display:none;">

  <h3>Webhook URL 設定</h3>

  <div style="margin-bottom:10px;">
    <input id="webhookNameInput" placeholder="名前（例：メモ用）" style="width:30%;">
    <input id="webhookInput" placeholder="https://discord.com/api/webhooks/..." style="width:50%;">
    <button onclick="addWebhook()">追加</button>
  </div>


  <h4>登録済み Webhook</h4>
  <div id="webhookListArea"></div>

</div>


<!-- リザルトタブ -->
<div id="resultTab" class="tabContent" style="display:none;">
  <h3>背景画像</h3>
  <input type="file" id="bgImageInput" accept="image/*" onchange="loadBackgroundImage(this.files[0])">
  <div style="font-size:12px;color:#666;">未設定の場合はデフォルト背景を使用</div>


  <h3>リザルト画像</h3>
  <button onclick="generateResultImage()">リザルト画像を生成</button>

  <canvas id="resultCanvas" width="800" height="1200" style="display:none;"></canvas>

</div>

<hr>

<h3>集計表示</h3>
<div class="button-bar">
  <button onclick="showRanking()">順位表</button>
  <button onclick="showRoundScores()">ラウンド別スコア</button>
  <button onclick="showTeamProgress()">チーム別推移</button>
</div>

<h3>即時集計送信</h3>
<button onclick="sendInstantScoreMulti(false)">途中経過を送信</button>

<div id="aggregateArea" style="margin-top:20px;"></div>


<script src="main.js"></script>

</body>
</html>
