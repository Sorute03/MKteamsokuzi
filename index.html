<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MK Team Sokuzi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: sans-serif;
  margin: 20px;
  background: #f5f5f5;
}

h2 {
  margin-top: 30px;
}

.section {
  background: white;
  padding: 15px;
  margin-bottom: 20px;
  border-radius: 8px;
  box-shadow: 0 0 4px rgba(0,0,0,0.1);
}

input, select, button {
  padding: 6px 10px;
  margin: 4px;
  font-size: 14px;
}

button {
  cursor: pointer;
}

.rank-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 10px;
}

.rank-button {
  width: 32px;
  height: 32px;
  background: #ddd;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 4px;
  cursor: pointer;
}

.rank-button.selected {
  background: #ff5555;
  color: white;
}

.team-section {
  margin-bottom: 20px;
  padding: 10px;
  background: #fafafa;
  border-radius: 6px;
  border: 1px solid #ddd;
}

.history-item {
  padding: 10px;
  margin: 6px 0;
  background: #fff;
  border-radius: 6px;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<h1>MK Team Sokuzi</h1>

<!-- ▼ Timestamp（3分割 UI） -->
<div class="section">
  <h2>試合日時</h2>
  <label>年：</label>
  <input id="tsYear" type="number" placeholder="2026" style="width:90px;">
  <label>月：</label>
  <input id="tsMonth" type="number" placeholder="6" style="width:60px;">
  <label>日：</label>
  <input id="tsDay" type="number" placeholder="3" style="width:60px;">
  <label>時：</label>
  <input id="tsHour" type="number" placeholder="21" style="width:60px;">
</div>

<!-- ▼ チーム設定 -->
<div class="section">
  <h2>チーム設定</h2>
  <label>自チーム名：</label>
  <input id="teamIdInput" placeholder="例: Aチーム">
  <button id="applyTeamId">設定</button>

  <h3>チーム一覧</h3>
  <input id="teamListInput" placeholder="例: A,B,C,D,E,F">
  <button id="applyTeamList">反映</button>
</div>

<!-- ▼ ラウンド入力 -->
<div class="section">
  <h2>ラウンド入力</h2>
  <div id="teams-container"></div>
</div>

<!-- ▼ 保存・読み込み -->
<div class="section">
  <h2>保存 / 読み込み</h2>

  <button id="saveLocal">ローカル保存</button>

  <h3>JSON エクスポート / インポート（全戦績）</h3>
  <button id="exportAllJson">全戦績エクスポート</button>
  <input type="file" id="importAllJson">

  <h3>P2P（全戦績同期）</h3>
  <button id="p2pCreateOffer">接続コード生成（A）</button>
  <textarea id="offerBox" style="width:100%;height:80px;"></textarea>

  <button id="p2pAcceptOffer">接続コード貼って応答（B）</button>
  <textarea id="answerBox" style="width:100%;height:80px;"></textarea>

  <button id="p2pAcceptAnswer">応答コードを貼る（A）</button>

  <button id="p2pSendAll">全戦績送信</button>
</div>

<!-- ▼ 履歴 -->
<div class="section">
  <h2>戦績履歴</h2>
  <div id="historyList"></div>
</div>

<script>
  /* ============================================================
   MK Team Sokuzi - main.js
   Part 2: 全ロジック（IndexedDB / 重複チェック / JSON / P2P / UI生成）
   ============================================================ */

/* ------------------------------------------------------------
   IndexedDB 初期化
------------------------------------------------------------ */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("mk_sokuzi_db", 1);

    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("history")) {
        db.createObjectStore("history", { keyPath: "id" });
      }
    };

    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}

/* ------------------------------------------------------------
   Timestamp（3分割 UI → timestamp）
------------------------------------------------------------ */
function getUserTimestamp() {
  const y = document.getElementById("tsYear").value.trim();
  const m = document.getElementById("tsMonth").value.trim();
  const d = document.getElementById("tsDay").value.trim();
  const h = document.getElementById("tsHour").value.trim();

  // 未入力 → 自動生成
  if (!y || !m || !d || !h) {
    return Date.now();
  }

  const year = Number(y);
  const month = Number(m);
  const day = Number(d);
  const hour = Number(h);

  if (year < 2000 || year > 2100) return Date.now();
  if (month < 1 || month > 12) return Date.now();
  if (day < 1 || day > 31) return Date.now();
  if (hour < 0 || hour > 23) return Date.now();

  const date = new Date(year, month - 1, day, hour, 0, 0);
  return date.getTime();
}

/* ------------------------------------------------------------
   重複チェック（timestamp + 自チーム名 / 内容完全一致）
------------------------------------------------------------ */
function buildHistoryKey(record) {
  return JSON.stringify({
    teamId: record.teamId,
    teams: record.teams,
    courseNames: record.courseNames,
    teamRanks: record.teamRanks,
    penalty: record.penalty,
    mode: record.mode
  });
}

function isDuplicateRecord(newRecord, existingRecords) {
  // ① timestamp + 自チーム名
  if (existingRecords.some(r =>
    r.timestamp === newRecord.timestamp &&
    r.teams[0] === newRecord.teams[0]
  )) {
    return true;
  }

  // ② 内容完全一致
  const newKey = buildHistoryKey(newRecord);
  const existingKeys = new Set(existingRecords.map(r => buildHistoryKey(r)));

  return existingKeys.has(newKey);
}

/* ------------------------------------------------------------
   ラウンド UI 生成
------------------------------------------------------------ */
let state = {
  teamId: "",
  teams: [],
  teamRanks: [],
  courseNames: [],
  penalty: 0,
  mode: "12R"
};

function createTeamInputs() {
  const container = document.getElementById("teams-container");
  container.innerHTML = "";

  const totalRounds = 12;

  for (let round = 0; round < totalRounds; round++) {
    const section = document.createElement("div");
    section.className = "team-section";

    const header = document.createElement("div");
    header.style.display = "flex";
    header.style.justifyContent = "space-between";

    const title = document.createElement("h3");
    title.textContent = `ラウンド ${round + 1}`;

    const confirmBtn = document.createElement("button");
    confirmBtn.textContent = "確定";
    confirmBtn.onclick = () => confirmRound(round);

    header.appendChild(title);
    header.appendChild(confirmBtn);
    section.appendChild(header);

    state.teams.forEach(team => {
      const label = document.createElement("div");
      label.textContent = team;
      section.appendChild(label);

      const row = document.createElement("div");
      row.className = "rank-buttons";

      for (let rank = 1; rank <= 24; rank++) {
        const btn = document.createElement("div");
        btn.className = "rank-button";
        btn.textContent = rank;

        btn.dataset.team = team;
        btn.dataset.round = round;
        btn.dataset.rank = rank;

        btn.onclick = () => toggleRank(team, round, rank, btn);

        row.appendChild(btn);
      }

      section.appendChild(row);
    });

    container.appendChild(section);
  }
}

/* ------------------------------------------------------------
   ランク選択
------------------------------------------------------------ */
function toggleRank(team, round, rank, btn) {
  if (!state.teamRanks[round]) state.teamRanks[round] = {};
  state.teamRanks[round][team] = rank;

  const buttons = btn.parentNode.querySelectorAll(".rank-button");
  buttons.forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
}

function confirmRound(round) {
  alert(`ラウンド ${round + 1} を確定しました`);
}

/* ------------------------------------------------------------
   スコア計算（必要なら後で拡張）
------------------------------------------------------------ */
function calculateTeamScores() {
  return {}; // 必要なら後で実装
}

/* ------------------------------------------------------------
   ローカル保存（1 試合）
------------------------------------------------------------ */
async function saveHistoryToLocal() {
  const timestamp = getUserTimestamp();

  const record = {
    teamId: state.teamId,
    mode: state.mode,
    teams: state.teams,
    teamRanks: state.teamRanks,
    teamScores: calculateTeamScores(),
    courseNames: state.courseNames,
    penalty: state.penalty,
    timestamp: timestamp
  };

  const db = await openDB();
  const tx = db.transaction("history", "readwrite");
  const store = tx.objectStore("history");

  const all = await store.getAll();

  if (isDuplicateRecord(record, all)) {
    alert("この戦績はすでに存在します（重複スキップ）");
    return;
  }

  store.put({ id: timestamp, ...record });
  await tx.complete;

  alert("戦績を保存しました");
  loadHistoryList();
}

/* ------------------------------------------------------------
   JSON 全戦績エクスポート
------------------------------------------------------------ */
async function exportAllHistoryJSON() {
  const db = await openDB();
  const tx = db.transaction("history", "readonly");
  const store = tx.objectStore("history");
  const all = await store.getAll();

  const blob = new Blob([JSON.stringify(all, null, 2)], {
    type: "application/json"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `mk_history_all_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ------------------------------------------------------------
   JSON 全戦績インポート
------------------------------------------------------------ */
async function importAllHistoryJSON(file) {
  const text = await file.text();
  const list = JSON.parse(text);

  const db = await openDB();
  const tx = db.transaction("history", "readwrite");
  const store = tx.objectStore("history");

  const existing = await store.getAll();

  let added = 0;
  for (const record of list) {
    if (!isDuplicateRecord(record, existing)) {
      store.put({ id: record.timestamp, ...record });
      existing.push(record);
      added++;
    }
  }

  await tx.complete;

  alert(`全戦績インポート完了：${added} 件追加`);
  loadHistoryList();
}

/* ------------------------------------------------------------
   P2P（全戦績同期）
------------------------------------------------------------ */
let peerConnection;
let dataChannel;

async function p2pCreateOffer() {
  peerConnection = new RTCPeerConnection();
  dataChannel = peerConnection.createDataChannel("mkdata");

  dataChannel.onopen = () => alert("P2P 接続完了");
  dataChannel.onmessage = e => receiveP2PData(e.data);

  const offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);

  document.getElementById("offerBox").value =
    btoa(JSON.stringify(offer));
}

async function p2pAcceptOffer() {
  const offer = JSON.parse(atob(document.getElementById("offerBox").value));

  peerConnection = new RTCPeerConnection();

  peerConnection.ondatachannel = e => {
    dataChannel = e.channel;
    dataChannel.onopen = () => alert("P2P 接続完了");
    dataChannel.onmessage = e => receiveP2PData(e.data);
  };

  await peerConnection.setRemoteDescription(offer);

  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);

  document.getElementById("answerBox").value =
    btoa(JSON.stringify(answer));
}

async function p2pAcceptAnswer() {
  const answer = JSON.parse(atob(document.getElementById("answerBox").value));
  await peerConnection.setRemoteDescription(answer);
}

async function p2pSendAll() {
  const db = await openDB();
  const tx = db.transaction("history", "readonly");
  const store = tx.objectStore("history");
  const all = await store.getAll();

  const ts = getUserTimestamp();
  const updated = all.map(r => ({ ...r, timestamp: ts }));

  dataChannel.send(JSON.stringify({
    type: "allHistory",
    data: updated
  }));

  alert("全戦績データを送信しました");
}

function receiveP2PData(text) {
  const packet = JSON.parse(text);

  if (packet.type === "allHistory") {
    mergeAllHistory(packet.data);
  }
}

async function mergeAllHistory(list) {
  const db = await openDB();
  const tx = db.transaction("history", "readwrite");
  const store = tx.objectStore("history");

  const existing = await store.getAll();

  let added = 0;
  for (const record of list) {
    if (!isDuplicateRecord(record, existing)) {
      store.put({ id: record.timestamp, ...record });
      existing.push(record);
      added++;
    }
  }

  await tx.complete;

  alert(`P2P で全戦績受信：${added} 件追加`);
  loadHistoryList();
}

/* ------------------------------------------------------------
   履歴表示
------------------------------------------------------------ */
async function loadHistoryList() {
  const db = await openDB();
  const tx = db.transaction("history", "readonly");
  const store = tx.objectStore("history");
  const all = await store.getAll();

  const list = document.getElementById("historyList");
  list.innerHTML = "";

  all.sort((a, b) => b.timestamp - a.timestamp);

  all.forEach(r => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = `${r.teams[0]} / ${new Date(r.timestamp).toLocaleString()}`;
    list.appendChild(div);
  });
}

</script>
</body>
</html>
