<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>MKteamsokuzi</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; }
    h1,h2,h3 { margin: 8px 0; }
    input, select, button { margin: 4px; padding: 4px 8px; }
    .flex { display: flex; gap: 8px; flex-wrap: wrap; }
    .section { border: 1px solid #ccc; padding: 8px; margin-bottom: 12px; }
    .team-section { border: 1px solid #ddd; padding: 8px; margin: 8px 0; }
    .rank-buttons { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 8px; }
    .rank-button {
      width: 28px; height: 24px; font-size: 11px;
      border: 1px solid #aaa; text-align: center; cursor: pointer;
      user-select: none;
    }
    .rank-button.selected {
      background: #007bff; color: #fff; border-color: #0056b3;
    }
    table { border-collapse: collapse; margin-top: 8px; }
    th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: center; }
    .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    .tabBtn { padding: 4px 8px; cursor: pointer; border: 1px solid #ccc; background: #eee; }
    .tabBtn.active { background: #ddd; font-weight: bold; }
    .tabContent { display: none; }
    .record { border: 1px solid #ccc; padding: 6px; margin: 4px 0; font-size: 13px; }
    #penaltyModal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; align-items: center; justify-content: center;
    }
    #penaltyModalInner {
      background: #fff; padding: 12px; border-radius: 4px; min-width: 200px;
    }
  </style>
</head>
<body>

<h1>MKteamsokuzi – GitHub API 保存版</h1>

<div class="section">
  <h2>チーム設定</h2>
  <div>
    <label>チームID：</label>
    <input id="teamIdInput" placeholder="例: ABC123" />
    <button onclick="generateTeamId()">自動生成</button>
    <button onclick="applyTeamId()">登録</button>
  </div>
  <div id="teamIdStatus" style="margin:4px 0;"></div>

  <div>
    <label>自チーム名：</label>
    <input id="myTeamInput" />
    <button onclick="saveMyTeamName()">自チーム名を保存</button>
  </div>

  <div style="margin-top:8px;">
    <label>モード：</label>
    <select id="modeSelect">
      <option value="6v6">6v6</option>
      <option value="4v4">4v4</option>
      <option value="3v3">3v3</option>
      <option value="2v2">2v2</option>
    </select>

    <label>チーム数：</label>
    <select id="teamCountSelect">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
      <option value="6">6</option>
      <option value="8">8</option>
      <option value="12">12</option>
    </select>
    <button onclick="applyTeamNames()">チーム名を反映</button>
  </div>

  <div id="enemyTeamEditor" style="margin-top:8px;"></div>
</div>

<div class="section">
  <h2>コース選択</h2>
  <div id="course-container"></div>
</div>

<div class="section">
  <h2>順位入力</h2>
  <div id="teams-container"></div>
</div>

<div class="section">
  <h2>スコア</h2>
  <button onclick="openPenaltyTeamSelect()">ペナルティ入力</button>
  <button onclick="resetRanks()">リセット</button>
  <table id="scoreTable">
    <thead>
      <tr><th>順位</th><th>チーム</th><th>スコア</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div style="margin-top:8px;">
    <button onclick="saveHistoryToGitHub()">この試合を GitHub に保存</button>
    <button onclick="saveHistoryRecord()">この試合をローカルに保存</button>
  </div>
</div>

<div class="section">
  <h2>戦績</h2>
  <div class="tabs">
    <button class="tabBtn active" data-tab="historyTab">共有戦績</button>
    <button class="tabBtn" data-tab="localTab">ローカル戦績</button>
  </div>
  <div id="historyTab" class="tabContent" style="display:block;">
    <button onclick="loadSharedHistory()">共有戦績を読み込み</button>
    <div id="sharedHistory" style="margin-top:8px;"></div>
  </div>
  <div id="localTab" class="tabContent">
    <button onclick="loadLocalHistory()">ローカル戦績を読み込み</button>
    <div id="localHistory" style="margin-top:8px;"></div>
  </div>
</div>

<div id="penaltyModal">
  <div id="penaltyModalInner">
    <h3>ペナルティ対象チーム選択</h3>
    <div id="penaltyTeamButtons" style="margin:8px 0;"></div>
    <button onclick="closePenaltyModal()">閉じる</button>
  </div>
</div>

<script>
/* ===== 設定 ===== */
const totalRounds = 12;
const GITHUB_REPO = "sorute03/MKteamsokuzi"; // 保存先リポジトリ
const GITHUB_TOKEN = "YOUR_TOKEN_HERE";      // ★本物は絶対にコミットしないこと

/* ===== 状態 ===== */
const state = {
  teamId: "",
  mode: "6v6",
  teams: ["チーム1","チーム2","チーム3","チーム4"],
  myTeam: "チーム1",
  enemyTeams: ["チーム2","チーム3","チーム4"],
  courseList: [
    // ここにコース名一覧を入れる
    "コースA","コースB","コースC","コースD"
  ],
  teamSizeMap: {},
  teamRanks: {},
  courseNames: Array(totalRounds).fill(""),
  penalty: {},
  currentRound: 0
};

/* ===== IndexedDB（history） ===== */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("mk_history", 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("history")) {
        db.createObjectStore("history", { keyPath:"id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/* ===== GitHub API ヘルパー ===== */
async function saveToGitHub(path, jsonData) {
  const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`;
  const content = btoa(JSON.stringify(jsonData, null, 2));
  const body = {
    message: "save data",
    content: content
  };
  const res = await fetch(url, {
    method: "PUT",
    headers: {
      "Authorization": `Bearer ${GITHUB_TOKEN}`,
      "Content-Type": "application/json",
      "Accept": "application/vnd.github+json"
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    console.error(await res.text());
    throw new Error("GitHub 保存失敗");
  }
  return await res.json();
}

async function loadFromGitHub(path) {
  const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`;
  const res = await fetch(url);
  if (!res.ok) return null;
  const data = await res.json();
  return JSON.parse(atob(data.content));
}

/* ===== チームID関連 ===== */
function generateTeamId() {
  const id = Math.random().toString(36).substring(2, 8).toUpperCase();
  document.getElementById("teamIdInput").value = id;
  applyTeamId();
}

async function applyTeamId() {
  const id = document.getElementById("teamIdInput").value.trim();
  if (!id) {
    alert("チームIDを入力してください");
    return;
  }
  state.teamId = id;
  document.getElementById("teamIdStatus").textContent =
    `チームID「${id}」を使用中`;

  // 自チーム名読み込み
  try {
    const data = await loadFromGitHub(`teamName/${id}.json`);
    if (data && data.myTeamName) {
      state.myTeam = data.myTeamName;
      document.getElementById("myTeamInput").value = data.myTeamName;
    }
  } catch (e) {
    console.log("自チーム名読み込み失敗", e);
  }

  alert("チームIDを登録しました");
}

/* 自チーム名保存（GitHub） */
async function saveMyTeamName() {
  if (!state.teamId) {
    alert("先にチームIDを登録してください");
    return;
  }
  const name = document.getElementById("myTeamInput").value.trim();
  if (!name) return;
  state.myTeam = name;
  await saveToGitHub(`teamName/${state.teamId}.json`, { myTeamName: name });
  alert("自チーム名をチームIDにリンクしました");
}

/* ===== フォーマット・UI構築 ===== */
function setFormatFromMode(modeStr) {
  state.mode = modeStr;
  const size = parseInt(modeStr.split("v")[0]);
  const totalPlayers = 24;
  const teamCount = totalPlayers / size;

  document.getElementById("teamCountSelect").value = String(teamCount);

  const names = [];
  names.push(state.myTeam || "チーム1");
  for (let i = 1; i < teamCount; i++) {
    names.push(state.enemyTeams[i-1] || `チーム${i+1}`);
  }
  state.teams = names;
  state.enemyTeams = names.slice(1);

  state.teamSizeMap = {};
  state.teams.forEach(team => state.teamSizeMap[team] = size);

  state.teamRanks = {};
  state.teams.forEach(team => {
    state.teamRanks[team] = {};
    for (let r=0; r<totalRounds; r++) state.teamRanks[team][r] = [];
  });

  createTeamNameEditor();
  createCourseSelectors();
  createTeamInputs();
  updateScores();
}

function createEnemyTeamEditor() {
  const count = parseInt(document.getElementById("teamCountSelect").value);
  const container = document.getElementById("enemyTeamEditor");
  container.innerHTML = "";
  for (let i = 1; i < count; i++) {
    const name = state.enemyTeams[i-1] || `チーム${i+1}`;
    const row = document.createElement("div");
    row.innerHTML = `
      <label>敵チーム${i}：</label>
      <input id="enemyTeamInput-${i}" value="${name}">
    `;
    container.appendChild(row);
  }
}

function createTeamNameEditor() {
  document.getElementById("myTeamInput").value = state.myTeam;
  createEnemyTeamEditor();
}

function applyTeamNames() {
  const count = parseInt(document.getElementById("teamCountSelect").value);
  const myTeam = document.getElementById("myTeamInput").value.trim() || "自チーム";
  const enemyTeams = [];
  for (let i = 1; i < count; i++) {
    const v = document.getElementById(`enemyTeamInput-${i}`).value.trim();
    enemyTeams.push(v || `敵チーム${i}`);
  }
  state.myTeam = myTeam;
  state.enemyTeams = enemyTeams;
  state.teams = [myTeam, ...enemyTeams];
  state.penalty = {};
  setFormatFromMode(state.mode);
  alert("チーム名を更新しました");
}

function createCourseSelectors() {
  const container = document.getElementById("course-container");
  container.innerHTML = "";
  for (let i=0; i<totalRounds; i++) {
    const row = document.createElement("div");
    row.innerHTML = `
      <label>ラウンド${i+1}：</label>
      <select id="course-select-${i}">
        ${state.courseList.map(c => `<option>${c}</option>`).join("")}
      </select>
    `;
    container.appendChild(row);
  }
}

function createTeamInputs() {
  const container = document.getElementById("teams-container");
  container.innerHTML = "";
  for (let round=0; round<totalRounds; round++) {
    const section = document.createElement("div");
    section.className = "team-section";

    const header = document.createElement("div");
    header.style.display = "flex";
    header.style.justifyContent = "space-between";
    header.innerHTML = `
      <h3>ラウンド${round+1}</h3>
      <button onclick="confirmRound(${round})">確定</button>
    `;
    section.appendChild(header);

    state.teams.forEach(team => {
      const label = document.createElement("div");
      label.textContent = team;

      const row = document.createElement("div");
      row.className = "rank-buttons";

      for (let rank=1; rank<=24; rank++) {
        const btn = document.createElement("div");
        btn.className = "rank-button";
        btn.textContent = rank;
        btn.dataset.team = team;
        btn.dataset.round = round;
        btn.dataset.rank = rank;
        btn.onclick = () => toggleRank(team, round, rank, btn);
        row.appendChild(btn);
      }

      section.appendChild(label);
      section.appendChild(row);
    });

    container.appendChild(section);
  }
}

/* ===== 順位入力・スコア計算 ===== */
function toggleRank(team, round, rank, btn) {
  const arr = state.teamRanks[team][round];
  const idx = arr.indexOf(rank);
  if (idx >= 0) {
    arr.splice(idx,1);
    btn.classList.remove("selected");
  } else {
    if (arr.length < state.teamSizeMap[team]) {
      arr.push(rank);
      btn.classList.add("selected");
    } else {
      alert(`${team} は最大 ${state.teamSizeMap[team]} 人です`);
    }
  }
  autoFillMissingTeam(round);
  updateScores();
}

function autoFillMissingTeam(round) {
  const filled = state.teams.filter(t =>
    state.teamRanks[t][round].length === state.teamSizeMap[t]
  );
  if (filled.length < state.teams.length - 1) return;

  const used = new Set();
  state.teams.forEach(t => {
    state.teamRanks[t][round].forEach(r => used.add(r));
  });

  const remaining = Array.from({length:24},(_,i)=>i+1).filter(r=>!used.has(r));

  state.teams.forEach(team => {
    const need = state.teamSizeMap[team];
    const arr = state.teamRanks[team][round];
    while (arr.length < need && remaining.length > 0) {
      const next = remaining.shift();
      arr.push(next);
      const btn = document.querySelector(
        `.rank-button[data-team="${team}"][data-round="${round}"][data-rank="${next}"]`
      );
      if (btn) btn.classList.add("selected");
    }
  });
}

function getPointsByRank(rank) {
  if (rank===1) return 15;
  if (rank===2) return 12;
  if (rank===3) return 10;
  if (rank===4||rank===5) return 9;
  if (rank===6||rank===7) return 8;
  if (rank===8||rank===9) return 7;
  if (rank>=10 && rank<=12) return 6;
  if (rank>=13 && rank<=15) return 5;
  if (rank>=16 && rank<=18) return 4;
  if (rank>=19 && rank<=21) return 3;
  if (rank===22||rank===23) return 2;
  if (rank===24) return 1;
  return 0;
}

function calculateTeamScores() {
  const result = {};
  state.teams.forEach(team => {
    let score = 0;
    for (let r=0; r<totalRounds; r++) {
      state.teamRanks[team][r].forEach(rank => {
        score += getPointsByRank(rank);
      });
    }
    score += (state.penalty[team] || 0);
    result[team] = score;
  });
  return result;
}

function updateScores() {
  const scores = calculateTeamScores();
  const results = Object.entries(scores).sort((a,b)=>b[1]-a[1]);

  const tbody = document.querySelector("#scoreTable tbody");
  tbody.innerHTML = "";
  results.forEach(([team,score],i)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${i+1}</td><td>${team}</td><td>${score}</td>`;
    tbody.appendChild(tr);
  });

  saveCurrentToGitHub();
}

function confirmRound(round) {
  const course = document.getElementById(`course-select-${round}`).value;
  state.courseNames[round] = course;

  for (const team of state.teams) {
    const need = state.teamSizeMap[team];
    const arr = state.teamRanks[team][round];
    if (arr.length !== need) {
      alert(`${team} の人数が不足しています`);
      return;
    }
  }
  alert(`ラウンド${round+1}を保存しました`);
}

/* ===== ペナルティ ===== */
function openPenaltyTeamSelect() {
  const container = document.getElementById("penaltyTeamButtons");
  container.innerHTML = "";
  state.teams.forEach(team=>{
    const btn = document.createElement("button");
    btn.textContent = team;
    btn.onclick = ()=>selectPenaltyTeam(team);
    container.appendChild(btn);
  });
  document.getElementById("penaltyModal").style.display = "block";
}
function closePenaltyModal() {
  document.getElementById("penaltyModal").style.display = "none";
}
function selectPenaltyTeam(team) {
  closePenaltyModal();
  const p = parseInt(prompt(`${team} のペナルティ点数`),10);
  if (!p) return;
  state.penalty[team] = (state.penalty[team] || 0) + p;
  updateScores();
}

/* ===== リセット ===== */
function resetRanks() {
  if (!confirm("リセットしますか？")) return;
  setFormatFromMode(state.mode);
}

/* ===== GitHub 保存（current / history） ===== */
async function saveCurrentToGitHub() {
  if (!state.teamId) return;
  const payload = {
    teamId: state.teamId,
    teamScores: calculateTeamScores(),
    teams: state.teams,
    timestamp: Date.now()
  };
  try {
    await saveToGitHub(`current/${state.teamId}.json`, payload);
  } catch (e) {
    console.log("current 保存失敗", e);
  }
}

async function saveHistoryToGitHub() {
  if (!state.teamId) {
    alert("先にチームIDを登録してください");
    return;
  }
  const payload = {
    teamId: state.teamId,
    mode: state.mode,
    teams: state.teams,
    teamRanks: state.teamRanks,
    teamScores: calculateTeamScores(),
    courseNames: state.courseNames,
    penalty: state.penalty,
    timestamp: Date.now()
  };
  const filename = `${state.teamId}/${payload.timestamp}.json`;
  await saveToGitHub(`history/${filename}`, payload);
  alert("この試合を GitHub に保存しました");
}

/* ===== ローカル保存 ===== */
async function saveHistoryRecord() {
  const db = await openDB();
  const tx = db.transaction("history","readwrite");
  const store = tx.objectStore("history");

  const record = {
    id: Date.now(),
    timestamp: Date.now(),
    mode: state.mode,
    teams: state.teams,
    teamRanks: state.teamRanks,
    teamScores: calculateTeamScores(),
    courseNames: state.courseNames,
    penalty: state.penalty,
    synced: false
  };

  store.put(record);
  await tx.complete;
  alert("この試合をローカル（IndexedDB）に保存しました");
}

/* ===== 共有戦績読み込み（GitHub） ===== */
async function loadSharedHistory() {
  if (!state.teamId) {
    document.getElementById("sharedHistory").textContent =
      "teamId を入力して登録してから開いてください。";
    return;
  }
  try {
    const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/history/${state.teamId}`;
    const res = await fetch(url);
    const container = document.getElementById("sharedHistory");
    if (!res.ok) {
      container.textContent = "共有戦績はまだありません。";
      return;
    }
    const files = await res.json();
    const results = [];
    for (const f of files) {
      const data = await loadFromGitHub(`history/${state.teamId}/${f.name}`);
      if (data) results.push(data);
    }
    results.sort((a,b)=>b.timestamp - a.timestamp);
    container.innerHTML = results.map(r => `
      <div class="record">
        <b>${new Date(r.timestamp).toLocaleString()}</b><br>
        モード: ${r.mode}<br>
        スコア: ${Object.entries(r.teamScores).map(([t,s])=>`${t}:${s}`).join(" / ")}
      </div>
    `).join("");
  } catch (e) {
    document.getElementById("sharedHistory").textContent =
      "共有戦績の取得に失敗しました。";
  }
}

/* ===== ローカル戦績読み込み ===== */
async function loadLocalHistory() {
  try {
    const db = await openDB();
    const tx = db.transaction("history","readonly");
    const store = tx.objectStore("history");
    const all = await store.getAll();
    const container = document.getElementById("localHistory");
    if (!all.length) {
      container.textContent = "ローカル戦績はまだありません。";
      return;
    }
    container.innerHTML = all.map(r => `
      <div class="record">
        <b>${new Date(r.timestamp).toLocaleString()}</b><br>
        モード: ${r.mode}<br>
        スコア: ${Object.entries(r.teamScores).map(([t,s])=>`${t}:${s}`).join(" / ")}
      </div>
    `).join("");
  } catch {
    document.getElementById("localHistory").textContent =
      "ローカル戦績の取得に失敗しました。";
  }
}

/* ===== タブ切り替え ===== */
document.querySelectorAll(".tabBtn").forEach(btn => {
  btn.onclick = () => {
    const target = btn.dataset.tab;
    document.querySelectorAll(".tabContent").forEach(tab => {
      tab.style.display = "none";
    });
    document.querySelectorAll(".tabBtn").forEach(b => {
      b.classList.remove("active");
    });
    document.getElementById(target).style.display = "block";
    btn.classList.add("active");

    if (target === "historyTab") {
      loadSharedHistory();
      loadLocalHistory();
    }
  };
});

/* ===== 自動更新（共有戦績のみ） ===== */
setInterval(() => {
  if (document.getElementById("historyTab").style.display === "block") {
    loadSharedHistory();
  }
}, 6 * 60 * 60 * 1000);

/* ===== 初期化 ===== */
document.getElementById("modeSelect").onchange = e => {
  setFormatFromMode(e.target.value);
};
document.getElementById("teamCountSelect").onchange = () => {
  createEnemyTeamEditor();
};

setFormatFromMode("6v6");
createTeamNameEditor();
</script>

</body>
</html>
