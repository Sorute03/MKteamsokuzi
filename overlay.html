<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 100vh;
  font-family: sans-serif;
}

#overlay {
  background-color: rgba(0,0,0,0.55);
  color: white;
  padding: 12px 20px;
  font-size: 24px;
  border-radius: 8px;
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
}

.team {
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="overlay">待機中...</div>

<script>
// ▼ GAS の URL（あなたのデプロイURLに置き換える）
const GAS_URL = "https://script.google.com/macros/s/AKfycbxl4y2BTq-aUgMsTNEXsB5UTulSSK_CKA2nsnTdWPtK0pkJJMtM59gVnfmxCAI4w806/exec";

// ▼ GAS から overlay データを取得
async function fetchOverlayFromGAS() {
  try {
    const res = await fetch(GAS_URL, { method: "GET" });
    const data = await res.json();

    if (data && data.type === "overlay") {
      console.log("GAS から取得:", data);
      updateOverlayUI(data);
    }
  } catch (err) {
    console.warn("GAS 取得エラー:", err);
  }
}

// ▼ 5秒ごとにポーリング
setInterval(fetchOverlayFromGAS, 5000);

// ▼ 初回即時実行
fetchOverlayFromGAS();


// ▼ UI 更新：scores は「チーム名キーのオブジェクト」として扱う
function updateOverlayUI(data) {
  const teams = data.teams.map(name => ({
    name,
    score: data.scores[name] ?? 0
  }));

  // スコア順にソート
  teams.sort((a, b) => b.score - a.score);

  let html = "<div style='display:flex; gap:20px;'>";

  for (let i = 0; i < teams.length; i++) {
    html += `
      <span class="team">
        ${i+1}位 ${teams[i].name}：${teams[i].score}点
      </span>
    `;
  }

  html += "</div>";

  document.getElementById("overlay").innerHTML = html;
}
</script>

</body>
</html>
