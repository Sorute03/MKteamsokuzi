<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 100vh;
  font-family: sans-serif;
}

#overlay {
  background-color: rgba(0,0,0,0.55);
  color: white;
  padding: 12px 20px;
  font-size: 24px;
  border-radius: 8px;
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
}

.team {
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="overlay">待機中...</div>

<script>
// ▼ 親にデータ要求
setTimeout(() => {
  window.parent.postMessage({ type: "requestOverlay" }, "*");
}, 300);

// ▼ 親から受信
window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== "overlay") return;

  console.log("受信したpayload:", data);

  updateOverlayUI(data);
});

// ▼ UI 更新（scores はオブジェクト形式）
function updateOverlayUI(data) {

  const teams = data.teams.map(name => ({
    name,
    score: data.scores[name] ?? 0   // ← ここが重要
  }));

  // ▼ スコア順に並び替え
  teams.sort((a, b) => b.score - a.score);

  let html = "<div style='display:flex; gap:20px;'>";

  for (let i = 0; i < teams.length; i++) {
    html += `
      <span class="team">
        ${i+1}位 ${teams[i].name}：${teams[i].score}点
      </span>
    `;
  }

  html += "</div>";

  document.getElementById("overlay").innerHTML = html;
}
</script>

</body>
</html>
