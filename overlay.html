<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 100vh;
  font-family: sans-serif;
}

#overlay {
  background-color: rgba(0,0,0,0.55);
  color: white;
  padding: 12px 20px;
  font-size: 24px;
  border-radius: 8px;
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
}

.team {
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="overlay">待機中...</div>

<script>
const params = new URLSearchParams(location.search);
const USER = params.get("user") || "default";
console.log("overlay USER:", USER);

// ▼ ユーザー別チャンネルを購読
const bc = new BroadcastChannel("overlay_channel_" + USER);

bc.onmessage = (event) => {
  const data = event.data;
  if (!data || data.type !== "overlay") return;

  // user チェックは不要（チャンネルが分かれているため）
  renderOverlay(data.payload);
};

// ▼ iframe / window.open 用 postMessage も残す
window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== "overlay") return;
  if (data.user !== USER) return;

  renderOverlay(data.payload);
});


/* ---------------------------------------------------------
   ① GAS から overlay データを取得（5秒ごと）
--------------------------------------------------------- */
`async function fetchOverlayFromGAS() {
  try {
    const res = await fetch(GAS_URL + "?t=" + Date.now());
    const data = await res.json();

    if (data && data.type === "overlay") {
      renderOverlay(data);
    }
  } catch (err) {
    console.warn("GAS 取得エラー:", err);
  }
}

setInterval(fetchOverlayFromGAS, 5000);
fetchOverlayFromGAS();`

/* ---------------------------------------------------------
   ② 親ページ（sokuzi.html）からの postMessage を受信
--------------------------------------------------------- */
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "overlay") return;

  // ▼ ★ユーザー名フィルタ（追加）
  if (event.data.user && event.data.user !== USER) return;

  // event.data は { type:"overlay", user:"xxx", payload:{...} }
  const payload = event.data.payload || event.data;

  renderOverlay(payload);
});

/* ---------------------------------------------------------
   ③ UI 更新（GAS / postMessage 共通）
--------------------------------------------------------- */
function renderOverlay(data) {
  if (!data.teams || !data.scores) {
    document.getElementById("overlay").textContent = "データ待機中...";
    return;
  }

  const teams = data.teams.map(name => ({
    name,
    score: data.scores?.[name] ?? 0
  }));

  teams.sort((a, b) => b.score - a.score);

  let html = "<div style='display:flex; gap:20px;'>";
  for (let i = 0; i < teams.length; i++) {
    html += `<span class="team">${i+1}位 ${teams[i].name}：${teams[i].score}点</span>`;
  }
  html += "</div>";

  document.getElementById("overlay").innerHTML = html;
}

  
</script>

</body>
</html>
