<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 100vh;
  font-family: sans-serif;
}

#overlay {
  background-color: rgba(0,0,0,0.55);
  color: white;
  padding: 12px 20px;
  font-size: 24px;
  border-radius: 8px;
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
}

.team {
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="overlay">待機中...</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbw6V8r0QeDs6PTzgU_tC0mWe6vOojWAB6_Rfj1Q7KBcf2htcZNSnHFkB9F1ENi-BRuc/exec";

// ▼ GAS から overlay データを取得
async function fetchOverlayFromGAS() {
  try {
    const res = await fetch(GAS_URL + "?t=" + Date.now());
    const data = await res.json();
    if (data && data.type === "overlay") {
      renderOverlay(data);
    }
  } catch (err) {
    console.warn("GAS 取得エラー:", err);
  }
}

// ▼ 親ページからの postMessage を受信
window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "overlay") return;
  renderOverlay(event.data);
});

// ▼ UI 更新関数
function renderOverlay(data) {
  const teams = data.teams.map(name => ({
    name,
    score: data.scores?.[name] ?? 0
  }));

  teams.sort((a, b) => b.score - a.score);

  let html = "<div style='display:flex; gap:20px;'>";
  for (let i = 0; i < teams.length; i++) {
    html += `<span class="team">${i+1}位 ${teams[i].name}：${teams[i].score}点</span>`;
  }
  html += "</div>";

  document.getElementById("overlay").innerHTML = html;
}

// ▼ 5秒ごとに GAS ポーリング
setInterval(fetchOverlayFromGAS, 5000);
fetchOverlayFromGAS();
</script>

</body>
</html>
