<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  padding: 0;
  background: transparent;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  height: 100vh;
}

#overlay {
  background-color: rgba(0,0,0,0.5);
  color: white;
  padding: 12px;
  font-size: 24px;
  border-radius: 8px;
  font-family: sans-serif;
  display: flex;
  gap: 20px;
  justify-content: center;
  align-items: center;
}

.team {
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="overlay">待機中...</div>

<script>
const bc = new BroadcastChannel("mk_overlay");

bc.onmessage = (event) => {
  const data = event.data;
  if (data.type !== "overlay") return;

  // ▼ GAS と同じ並び順にソート（score 降順）
  const teams = data.teams.map((t, i) => ({
    name: t,
    score: data.scores[i] ?? 0
  })).sort((a, b) => b.score - a.score);

  // ▼ GAS と同じ HTML を生成
  let html = "<div style='display:flex; gap:20px; justify-content:center; align-items:center;'>";

  for (let i = 0; i < teams.length; i++) {
    html += `<span class="team">${i+1}位 ${teams[i].name}：${teams[i].score}点</span>`;
  }

  html += "</div>";

  document.getElementById("overlay").innerHTML = html;
};
</script>

</body>
</html>
