<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MK Sokuzi Overlay</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Segoe UI', Meiryo, sans-serif;
    color: white;
  }

  /* 集計表示エリア（横一列バー表示） */
  #overlayBox {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%); /* 画面中央下部に配置 */
    background: rgba(15, 23, 42, 0.90);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
    color: #94a3b8;
    padding-right: 15px;
    border-right: 1px solid rgba(255, 255, 255, 0.2);
    line-height: 1.3;
  }

  /* チーム一覧を横並び（row）に設定 */
  .team-list {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 12px;
  }

  .team-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.05);
  }

  .team-row.my-team {
    background: rgba(56, 189, 248, 0.2);
    border: 1px solid #38bdf8;
  }

  .rank-badge {
    font-size: 14px;
    font-weight: 800;
    color: #cbd5e1;
  }

  .team-name {
    font-size: 15px;
    font-weight: 600;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .score-val {
    font-size: 18px;
    font-weight: 800;
    color: #f8fafc;
  }

  .diff-val {
    font-size: 13px;
    font-weight: 700;
  }

  .diff-plus { color: #4ade80; }  /* プラス差分 (緑) */
  .diff-minus { color: #f87171; } /* マイナス差分 (赤) */
  .diff-zero { color: #64748b; }  /* 基準/同点 */

  /* OBS設定パネル */
  #configBox {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(0, 0, 0, 0.9);
    padding: 16px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 999;
  }

  #configBox input {
    margin: 4px 0;
    padding: 6px;
    width: 180px;
    display: block;
    border: 1px solid #475569;
    border-radius: 4px;
    background: #1e293b;
    color: #fff;
  }

  #configBox button {
    margin-top: 8px;
    padding: 6px 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  #statusText {
    margin-top: 6px;
    font-size: 12px;
    color: #f87171;
  }
</style>

<!-- ★ PeerJS ライブラリ -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<!-- ★ OBS WebSocket ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/obs-websocket-js@5.0.3/dist/obs-ws.min.js"></script>
</head>
<body>

<!-- OBS接続設定フォーム -->
<div id="configBox">
  <b>OBS WebSocket 接続設定</b>
  <input type="text" id="obsHost" placeholder="localhost" value="localhost">
  <input type="text" id="obsPort" placeholder="4455" value="4455">
  <input type="password" id="obsPassword" placeholder="OBSパスワード">
  <button onclick="initOBS()">接続して非表示</button>
  <div id="statusText"></div>
</div>

<div id="overlayBox">待機中...</div>

<script>
// ======================================================
// 1. PeerJS 連携処理
// ======================================================
const params = new URLSearchParams(location.search);
const USER = params.get("user");

console.log("[overlay] USER =", USER);

if (USER) {
  console.log("[overlay] PeerJS を初期化します…");
  const peer = new Peer("overlay-" + USER);

  peer.on("open", id => {
    console.log("[overlay] PeerID open:", id);
  });

  peer.on("error", err => {
    console.error("[overlay] PeerJS error:", err);
  });

  peer.on("disconnected", () => {
    console.warn("[overlay] PeerJS disconnected");
  });

  peer.on("close", () => {
    console.warn("[overlay] PeerJS connection closed");
  });

  peer.on("connection", conn => {
    console.log("[overlay] ADP と接続:", conn.peer);

    conn.on("open", () => {
      console.log("[overlay] conn.open: 接続成功");
    });

    conn.on("data", payload => {
      console.log("[overlay] PeerJS 受信 payload:", payload);
      renderOverlay(payload);
    });

    conn.on("error", err => {
      console.error("[overlay] conn error:", err);
    });

    conn.on("close", () => {
      console.warn("[overlay] conn closed");
    });
  });
} else {
  console.log("[overlay] ?user パラメータなし。PeerJS 連携はスキップします");
}

// ======================================================
// 2. OBS WebSocket 連携処理
// ======================================================
const obs = new OBSWebSocket();

function saveSettings() {
  localStorage.setItem("obsHost_overlay", document.getElementById("obsHost").value);
  localStorage.setItem("obsPort_overlay", document.getElementById("obsPort").value);
  localStorage.setItem("obsPassword_overlay", document.getElementById("obsPassword").value);
}

function loadSettings() {
  const host = localStorage.getItem("obsHost_overlay") || "localhost";
  const port = localStorage.getItem("obsPort_overlay") || "4455";
  const pass = localStorage.getItem("obsPassword_overlay") || "";

  document.getElementById("obsHost").value = host;
  document.getElementById("obsPort").value = port;
  document.getElementById("obsPassword").value = pass;
}

async function initOBS() {
  const host = document.getElementById("obsHost").value.trim() || "localhost";
  const port = document.getElementById("obsPort").value.trim() || "4455";
  const password = document.getElementById("obsPassword").value;
  const statusText = document.getElementById("statusText");

  saveSettings();

  try {
    console.log("[overlay] OBS WebSocket 接続試行...");
    statusText.style.color = "#facc15";
    statusText.textContent = "接続中...";

    // イベント重複登録を防止
    obs.removeAllListeners("CustomEvent");
    obs.on("CustomEvent", (data) => {
      console.log("[overlay] OBS イベント受信:", data);
      
      const rawData = data.eventData || data;
      renderOverlay(rawData);
    });

    await obs.connect(`ws://${host}:${port}`, password);

    console.log("[overlay] OBS WebSocket 接続成功");
    document.getElementById("configBox").style.display = "none";

  } catch (e) {
    console.error("[overlay] OBS WebSocket 接続失敗:", e);
    statusText.style.color = "#f87171";
    statusText.textContent = "接続失敗: パスワードを確認してください";
  }
}

// ======================================================
// 3. 即時集計（途中経過）描画処理
// ======================================================
function renderOverlay(data) {
  console.log("[overlay] renderOverlay 実行:", data);

  const box = document.getElementById("overlayBox");
  if (!data) return;

  const payload = data.payload || data;

  // ----------------------------------------------------
  // パターン A: 送信データが `ranking` 配列形式の場合
  // ----------------------------------------------------
  if (payload.ranking && Array.isArray(payload.ranking)) {
    const sortedRanking = [...payload.ranking].sort((a, b) => {
      if (a.rank !== undefined && b.rank !== undefined) {
        return a.rank - b.rank;
      }
      return (b.score || 0) - (a.score || 0);
    });

    let teamsHtml = "";

    sortedRanking.forEach(item => {
      const isMyTeam = item.isMyTeam || (payload.myTeam && item.team === payload.myTeam);
      
      let diffStr = "-";
      let diffClass = "diff-zero";

      if (typeof item.diff === "number") {
        if (item.diff < 0) {
          diffStr = `${item.diff}`;
          diffClass = "diff-minus";
        } else if (item.diff > 0) {
          diffStr = `+${item.diff}`;
          diffClass = "diff-plus";
        }
      }

      teamsHtml += `
        <div class="team-row ${isMyTeam ? 'my-team' : ''}">
          <span class="rank-badge">${item.rank ?? ''}位</span>
          <span class="team-name">${item.team ?? ''}</span>
          <span class="score-val">${item.score ?? 0}</span>
          <span class="diff-val ${diffClass}">(${diffStr})</span>
        </div>
      `;
    });

    box.innerHTML = `
      <div class="header">
        <span>試合</span>
        <span>経過</span>
      </div>
      <div class="team-list">
        ${teamsHtml}
      </div>
    `;
    return;
  }

  // ----------------------------------------------------
  // パターン B: 送信データが `scores` オブジェクト形式の場合
  // ----------------------------------------------------
  if (payload.scores) {
    const currentRound = payload.currentRound || 0;
    const totalRounds = payload.totalRounds || 12;
    const myTeam = payload.myTeam || "";

    const sortedTeams = Object.entries(payload.scores)
      .map(([team, score]) => ({ team, score }))
      .sort((a, b) => b.score - a.score);

    if (sortedTeams.length === 0) return;

    const topScore = sortedTeams[0].score;
    let teamsHtml = "";

    sortedTeams.forEach((item, index) => {
      const isMyTeam = (item.team === myTeam);
      const rank = index + 1;
      
      const diff = item.score - topScore;
      let diffStr = "-";
      let diffClass = "diff-zero";

      if (diff < 0) {
        diffStr = `${diff}`;
        diffClass = "diff-minus";
      }

      teamsHtml += `
        <div class="team-row ${isMyTeam ? 'my-team' : ''}">
          <span class="rank-badge">${rank}位</span>
          <span class="team-name">${item.team}</span>
          <span class="score-val">${item.score}</span>
          <span class="diff-val ${diffClass}">(${diffStr})</span>
        </div>
      `;
    });

    box.innerHTML = `
      <div class="header">
        <span>進行</span>
        <span>${currentRound}/${totalRounds}R</span>
      </div>
      <div class="team-list">
        ${teamsHtml}
      </div>
    `;
  }
}

// 初期化
window.addEventListener("DOMContentLoaded", () => {
  loadSettings();
  initOBS();
});
</script>
</body>
</html>
