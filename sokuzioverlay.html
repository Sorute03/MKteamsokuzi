<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OBS Score Overlay</title>
<script src="https://unpkg.com/obs-websocket-js"></script>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: transparent;
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
  }
  .container {
    width: 320px;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .title {
    font-size: 14px;
    font-weight: bold;
    color: #94a3b8;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
  }
  .row.my-team {
    background: rgba(59, 130, 246, 0.3);
    border: 1px solid rgba(59, 130, 246, 0.6);
  }
  .rank { font-weight: bold; width: 30px; }
  .team-name { flex-grow: 1; }
  .score { font-weight: bold; margin-right: 8px; }
  .diff { font-size: 12px; color: #cbd5e1; }
</style>
</head>
<body>

<div class="container">
  <div class="title" id="overlayTitle">SCOREBOARD</div>
  <div id="rankingList"></div>
</div>

<script>
  const obs = new OBSWebSocket();

  async function initOBS() {
    try {
      // OBS内部のブラウザソースから接続するため localhost 指定
      await obs.connect("ws://localhost:4455", "YOUR_OBS_PASSWORD");
      console.log("OBS Overlay Connected");

      // 送信側からの CustomEvent (Payload) を待機
      obs.on("CustomEvent", (data) => {
        if (data.vendorName === "mk-sokuzi") {
          renderOverlay(data.eventData);
        }
      });

    } catch (e) {
      console.error("Overlay OBS Connection Failed:", e);
    }
  }

  function renderOverlay(payload) {
    const titleEl = document.getElementById("overlayTitle");
    const listEl = document.getElementById("rankingList");

    if (titleEl) {
      titleEl.textContent = `自チーム: ${payload.myTeam}`;
    }

    listEl.innerHTML = payload.ranking.map(item => `
      <div class="row ${item.isMyTeam ? 'my-team' : ''}">
        <span class="rank">${item.rank}位</span>
        <span class="team-name">${item.team}</span>
        <span class="score">${item.score}点</span>
        <span class="diff">${item.diff === 0 ? '-' : item.diff}</span>
      </div>
    `).join('');
  }

  initOBS();
</script>
</body>
</html>
